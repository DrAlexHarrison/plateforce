name: release

# Cuts a draft release carrying every artefact, and refuses one that is missing a platform.
# Draft rather than published: a person presses the button.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # First, and everything below waits on it. The tag is the one input to this route that a
  # person types, and until now it was the one input nothing compared against anything. A
  # tag naming a version the manifests do not name produces a release page titled v0.2.0
  # carrying seven files named 0.1.0, and the artefact check passes, because those names
  # agree with each other. Thirty seconds here rather than after a seven minute matrix.
  named:
    name: the tag names the version the manifests do
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: One release, one version
        run: |
          python3 scripts/verify-version-homes.py \
            --ref-type "${{ github.ref_type }}" --ref-name "${{ github.ref_name }}"

  linux:
    needs: named
    uses: ./.github/workflows/desktop-linux.yml
    secrets: inherit
  macos:
    needs: named
    uses: ./.github/workflows/desktop-macos.yml
    secrets: inherit
    with:
      # A dispatch exercises the whole route and may hand back an ad-hoc build. A tag is
      # what reaches a reader, and docs/install.md tells that reader the file opens with no
      # warning, which is true only of a signed and notarised one.
      must_be_signed: ${{ startsWith(github.ref, 'refs/tags/') }}
  windows:
    needs: named
    uses: ./.github/workflows/desktop-windows.yml
    secrets: inherit

  gather:
    name: every artefact the release promises
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: gathered

      - name: Put them where the check looks
        run: |
          mkdir -p dist
          find gathered -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' \
               -o -name '*-setup.exe' -o -name 'plateforce-*-linux-static' \
               -o -name 'plateforce-universal-macos' \
               -o -name 'plateforce-x86_64-windows.exe' \) \
            -exec cp {} dist/ \;
          # An artefact is zipped in transit and comes back without its executable bit, so
          # the programs below arrive whole and refuse to run. Restoring the bit is not the
          # place to notice a missing platform: a glob that matches nothing would fail here
          # and hide the count below, which is what says which artefact did not arrive.
          find dist -maxdepth 1 -type f \
            \( -name 'plateforce-*-linux-static' -o -name '*.AppImage' \) \
            -exec chmod +x {} +
          ls -la dist/

      # Counted against a declared list rather than inspected one by one, and the two
      # version homes are asserted to agree. A build leg that dropped out leaves the
      # artefacts that did arrive perfectly valid, so a check reading only what is present
      # reports a release missing a platform as sound.
      - name: The declared set arrived, and the versions agree
        run: bash scripts/verify-release-artefacts.sh dist

      # NOTICE carries what every dependency is licensed under, and a release is the point
      # at which that table reaches somebody who has to rely on it.
      - name: The licence table is what cargo resolved
        run: python3 scripts/write-dependency-licences.py --check

      # Same character as the check above, and the same moment. The entry tells a reader to
      # record the version, the registry revision and the registry digest beside any number
      # they publish, so a digest the changelog asserts and the build does not report is a
      # reader following a pointer to a rule set that never existed. Builds the binary itself
      # rather than reading whatever an earlier step left behind.
      - name: The identifiers the changelog prints are the ones this build reports
        run: |
          cargo build -q -p plateforce-cli
          python3 scripts/check-changelog-identifiers.py

      - name: Which registry produced these numbers
        id: registry
        run: |
          # Taken from the software rather than typed. A digest in somebody's methods
          # section two years from now resolves to this tag through the release body, and a
          # second implementation of the digest is the failure this project publishes about.
          {
            echo "notes<<END_OF_NOTES"
            echo "Installation routes are in [docs/install.md](docs/install.md)."
            echo ""
            echo '```'
            cargo run -q -p plateforce-cli -- registry validate
            echo '```'
            echo "END_OF_NOTES"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: release-set
          path: dist/*
          if-no-files-found: error

    outputs:
      notes: ${{ steps.registry.outputs.notes }}

  draft:
    name: draft the release
    needs: gather
    # A tag, and nothing else, creates a release object. Everything above this runs on a
    # manual dispatch too, so the whole route can be exercised, artefacts and checks
    # included, without putting anything on the releases page that a person did not ask for.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    # The one job that can write, and it checks nothing out and runs no repository code.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-set
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          body: ${{ needs.gather.outputs.notes }}
