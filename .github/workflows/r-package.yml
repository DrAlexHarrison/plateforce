name: R package

# Every input this gate reads, including itself, so a push that edits only the gate still
# has to meet it.
on:
  push:
    paths:
      - 'bindings/r/**'
      - 'crates/plateforce-core/**'
      - 'crates/plateforce-registry/**'
      - 'crates/plateforce-analysis/**'
      - 'registry/**'
      - 'scripts/check-r-help-renders-its-markup.py'
      - '.github/workflows/r-package.yml'
  pull_request:
    paths:
      - 'bindings/r/**'
      - 'crates/plateforce-core/**'
      - 'crates/plateforce-registry/**'
      - 'crates/plateforce-analysis/**'
      - 'registry/**'
      - 'scripts/check-r-help-renders-its-markup.py'
      - '.github/workflows/r-package.yml'
  workflow_dispatch:

jobs:
  check:
    name: R CMD check on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Add the Windows target
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: bindings/r
          extra-packages: any::rcmdcheck, any::testthat
          needs: check

      - name: Copy the engine and the registry into the package
        shell: bash
        run: bash bindings/r/tools/sync-engine.sh

      - name: The copy is this repository's engine
        shell: bash
        run: bash bindings/r/tools/check-engine-version.sh

      # Runs after the sync, because the sync is what puts the engine's deep source tree
      # inside the package and moves every path a prefix longer. Before the check rather
      # than inside it, so the failure names the file rather than arriving as one NOTE among
      # five on a queue that costs weeks to re-enter.
      - name: Every path fits a tarball
        shell: bash
        run: sh bindings/r/tools/check-portable-paths.sh

      - name: One file names the binding framework
        shell: bash
        env:
          PLATEFORCE_SKIP_TIMING: '1'
        run: bash bindings/r/tools/framework-seam.sh

      # The engine builds with `--offline`, because the archive a reader installs from carries
      # its dependencies and reaches no network. A git checkout carries no such copy, so the
      # build resolves nothing and names the first crate it wanted rather than the cause. This
      # is the step the archive's own preparation runs.
      - name: Vendor the engine's dependencies, which the offline build reads
        shell: bash
        run: bash bindings/r/tools/vendor.sh

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: bindings/r
          args: 'c("--no-manual", "--as-cran")'
          upload-snapshots: true

      - name: Report the surface by executing the installed package
        shell: bash
        run: |
          set -euo pipefail
          R CMD INSTALL bindings/r
          Rscript -e 'cat(plateforce::pf_version(), "\n")'
          Rscript -e 'print(plateforce::pf_registry()@census)'
          Rscript -e 'writeLines(plateforce:::rust_registry_json(system.file("registry", package = "plateforce")))' \
            > capability-from-r.json
          test -s capability-from-r.json

      # `R CMD check` unpacks the package on its own, away from the recorded trial and the
      # sources, so the assertions that recompute from that trial and scan those sources
      # skip there. Run beside the checkout they need, they run.
      - name: Hold the surface to the recorded trial
        shell: bash
        run: Rscript bindings/r/tools/run-suite.R bindings/r

      - name: The boundary cost, measured
        shell: bash
        run: bash bindings/r/tools/framework-seam.sh

  floor:
    name: The floor the package declares
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the declared floor
        id: floor
        run: echo "version=$(grep -v '^ *#' bindings/r/tools/msrv | grep -v '^ *$' | head -1 | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.floor.outputs.version }}

      # extendr-ffi reads the installed R's version and headers from its build script, so
      # the binding crate does not compile on a machine without R.
      - uses: r-lib/actions/setup-r@v2

      - name: Copy the engine and the registry into the package
        run: bash bindings/r/tools/sync-engine.sh

      # The declared comparisons and the compile that tests the SystemRequirements claim
      # both live here, because this is the job that installs the toolchain they measure.
      - name: The floor is a measurement
        run: bash bindings/r/tools/check-floor.sh

  # Reads the rendered man/ pages, which are committed, so it needs neither R nor a toolchain
  # and runs once rather than three times across the matrix. Roxygen turns a cross-reference
  # into a link and a code span into markup; a page that carries the source spelling instead
  # renders as literal brackets to whoever types `?pf_analyse`, and R CMD check passes it.
  help_pages:
    name: Every help page renders its own markup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ask every page whether its cross-references and code spans render
        run: python3 scripts/check-r-help-renders-its-markup.py

  lint:
    name: The R crate's own formatting and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # extendr-ffi reads the installed R's version and headers from its build script, so
      # clippy cannot check the crate on a machine without R.
      - uses: r-lib/actions/setup-r@v2

      - name: Copy the engine and the registry into the package
        run: bash bindings/r/tools/sync-engine.sh

      # The detached workspace means the repository root's `cargo fmt --all` and
      # `cargo clippy` do not reach this crate, so the gap is covered here rather
      # than noted. Clippy caches per crate and under-reports straight after a build,
      # so this job runs it on a cold target directory.
      - name: Formatting
        working-directory: bindings/r/src/rust
        run: cargo fmt --check -p plateforce-r

      # `--no-deps` because the engine crates are members of this detached workspace and
      # their lints belong to the workstreams that own them, not to this gate.
      - name: Lints
        working-directory: bindings/r/src/rust
        run: cargo clippy -p plateforce-r --no-deps --all-targets -- -D warnings
