name: Publish the browser build

# The browser build is the only delivery channel with no certificate, no notarisation, no
# installer and no store review, so it is the one that ships first.

on:
  push:
    branches: [main]
  # Without this a dependency bump reaches main having run no Rust test at all, which is
  # how the declared toolchain floor drifted below the one the tree actually needs.
  pull_request:
  workflow_dispatch:

# Pull request code compiles and runs here, and a build script runs at compile time.
# Reading the checkout is the whole of what that needs. The token that can publish is
# granted to the deploy job alone, which runs no repository code.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup target add wasm32-unknown-unknown

      # Formatting is settled by the tool so it is never settled in review.
      - name: Check the formatting
        run: cargo fmt --all --check

      - name: Read the pinned wasm-bindgen version
        id: pin
        run: |
          version="$(sed -n 's/^wasm-bindgen = .*version = "=\([0-9.]*\)".*/\1/p' crates/plateforce-wasm/Cargo.toml)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: pages-${{ runner.os }}-${{ steps.pin.outputs.version }}-${{ hashFiles('Cargo.lock') }}

      - name: Check the workspace
        run: cargo test --workspace

      - name: Build the browser bundle
        run: ./scripts/build-web.sh release

      # The browser is the one surface no cargo command reaches, so the only proof it still
      # renders is to load it and read the page back. Chrome is asked for first and by name,
      # because a driver that is absent and a page that is broken produce the same silence.
      - name: The demonstration trial still renders
        run: |
          if ! command -v google-chrome >/dev/null; then
            echo "no google-chrome on this runner, so the browser was not checked" >&2
            exit 3
          fi
          node scripts/screen-check-demo.mjs web 8731

      # The page holds a researcher's trace, and `web/README.md` tells its reader that trace
      # never leaves the machine. This records every address the page asks for while a trial is
      # analysed, so the claim is measured rather than read off the source. It exits 2 when the
      # journey does not finish, because a page that never analysed anything reaches no address
      # and would otherwise pass while proving nothing.
      - name: The page reaches no address but its own
        run: |
          if ! command -v google-chrome >/dev/null; then
            echo "no google-chrome on this runner, so the addresses were not read" >&2
            exit 3
          fi
          node scripts/verify-browser-reaches-no-address.mjs web 8741

      # A registry that fails its own validator must not be published silently. The site
      # reports violations in its own interface; this makes them visible in the build log
      # too, and does not block the deploy, because a site that explains why the registry
      # is broken is more useful than no site.
      - name: Report registry validation
        run: cargo run --quiet --package plateforce-cli -- registry validate || true

      # A pull request runs every check above and publishes nothing.
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: web

  # Nothing above compiles at the version the workspace tells the world it supports, so a
  # first-party construct or a dependency feature newer than the declared floor reaches a
  # user on that toolchain having passed every check. The floor is read from the manifest
  # rather than written down again here.
  floor:
    name: the workspace compiles on the toolchain floor it declares
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the declared floor against the one the dependency tree needs
        run: ./scripts/check-msrv.sh

      - name: Read the declared floor
        id: floor
        run: |
          version="$(./scripts/check-msrv.sh --print-declared-floor)"
          test -n "$version"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install the declared floor toolchain
        env:
          FLOOR: ${{ steps.floor.outputs.version }}
        run: rustup toolchain install "$FLOOR" --profile minimal

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: floor-${{ runner.os }}-${{ steps.floor.outputs.version }}-${{ hashFiles('Cargo.lock') }}

      # Every target, so the test and example code has to compile on the floor as well as
      # the library. `--locked` because the lockfile is what a user on that toolchain gets.
      - name: Compile the workspace on the declared floor
        env:
          FLOOR: ${{ steps.floor.outputs.version }}
        run: cargo "+$FLOOR" check --workspace --locked --all-targets

  # A raster font under cmd.exe mangles anything outside ASCII, so the terminal surface
  # restricts itself and nothing measured that it does. The commands are run rather than
  # read: a glyph arrives through whatever the code path emits, including a dependency's
  # error text, which a search of this repository cannot see.
  ascii:
    name: the terminal surface emits ASCII
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ascii-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # Exit 1 is a non-ASCII byte. Exit 3 is the check being unable to measure, which is
      # reported separately because a run that could not look is not a run that found
      # nothing.
      - name: Run the commands and read every byte they write
        run: ./scripts/check-cli-output-is-ascii.sh

  # A surface that can raise a refusal code its own manifest does not publish hands a caller
  # a class to catch that the manifest says does not exist. The count is held to a ceiling
  # that only falls, so a code closed cannot quietly be replaced by a new one.
  vocabulary:
    name: every refusal code a surface raises is one it publishes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Measure each surface against its own manifest
        run: python3 ./scripts/check-refusal-vocabulary.py

  deploy:
    needs: [build, floor]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The two tokens that can publish, on the one job that publishes. It checks nothing
    # out and runs no code from the repository.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Reads the Pages configuration and fails here rather than mid-deploy when the site
      # is not set to build from a workflow.
      - uses: actions/configure-pages@v5

      - id: deployment
        uses: actions/deploy-pages@v4
