name: Publish the browser build

# The browser build is the only delivery channel with no certificate, no notarisation, no
# installer and no store review, so it is the one that ships first.

on:
  push:
    branches: [main]
  # Without this a dependency bump reaches main having run no Rust test at all, which is
  # how the declared toolchain floor drifted below the one the tree actually needs.
  pull_request:
  workflow_dispatch:

# Pull request code compiles and runs here, and a build script runs at compile time.
# Reading the checkout is the whole of what that needs. The token that can publish is
# granted to the deploy job alone, which runs no repository code.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      - name: Read the pinned wasm-bindgen version
        id: pin
        run: |
          version="$(sed -n 's/^wasm-bindgen = .*version = "=\([0-9.]*\)".*/\1/p' crates/plateforce-wasm/Cargo.toml)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: pages-${{ runner.os }}-${{ steps.pin.outputs.version }}-${{ hashFiles('Cargo.lock') }}

      - name: Check the workspace
        run: cargo test --workspace

      - name: Build the browser bundle
        run: ./scripts/build-web.sh release

      # A registry that fails its own validator must not be published silently. The site
      # reports violations in its own interface; this makes them visible in the build log
      # too, and does not block the deploy, because a site that explains why the registry
      # is broken is more useful than no site.
      - name: Report registry validation
        run: cargo run --quiet --package plateforce-cli -- registry validate || true

      # A pull request runs every check above and publishes nothing.
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: web

  # Nothing above compiles at the version the workspace tells the world it supports, so a
  # first-party construct or a dependency feature newer than the declared floor reaches a
  # user on that toolchain having passed every check. The floor is read from the manifest
  # rather than written down again here.
  floor:
    name: the workspace compiles on the toolchain floor it declares
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the declared floor against the one the dependency tree needs
        run: ./scripts/check-msrv.sh

      - name: Read the declared floor
        id: floor
        run: |
          version="$(./scripts/check-msrv.sh --print-declared-floor)"
          test -n "$version"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install the declared floor toolchain
        env:
          FLOOR: ${{ steps.floor.outputs.version }}
        run: rustup toolchain install "$FLOOR" --profile minimal

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: floor-${{ runner.os }}-${{ steps.floor.outputs.version }}-${{ hashFiles('Cargo.lock') }}

      # Every target, so the test and example code has to compile on the floor as well as
      # the library. `--locked` because the lockfile is what a user on that toolchain gets.
      - name: Compile the workspace on the declared floor
        env:
          FLOOR: ${{ steps.floor.outputs.version }}
        run: cargo "+$FLOOR" check --workspace --locked --all-targets

  deploy:
    needs: [build, floor]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The two tokens that can publish, on the one job that publishes. It checks nothing
    # out and runs no code from the repository.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Reads the Pages configuration and fails here rather than mid-deploy when the site
      # is not set to build from a workflow.
      - uses: actions/configure-pages@v5

      - id: deployment
        uses: actions/deploy-pages@v4
