name: python wheels

# Builds the source distribution and one abi3 wheel per platform, then installs each into
# a clean environment and runs the test suite against it. A tag, and only a tag, then
# publishes what those jobs proved.

on:
  push:
    branches: [main]
    # The tag is what publishes, so this workflow has to run on one. Path filters are not
    # evaluated for tag pushes, so a `v*` tag runs the whole route whatever it touched, and a
    # push to main goes on being filtered by the list below. Both refs are named because a
    # trigger that names only one does not run for the other.
    tags: ["v*"]
    # Every input this workflow reads, including the gates themselves. A push that edits
    # only the gate has to meet it.
    #
    # The crate list is the dependency closure of plateforce-python read out of cargo
    # metadata, not a list anybody remembers. It resolves to four: analysis, batch, core and
    # registry. batch was missing until 2026-08-04, which is the same defect as the analysis
    # crate missing before 20519b5 and one crate over from the fix for it. Python wraps that
    # crate in a module of its own, src/batch.rs, publishing RunRow and BatchResult, so a
    # push to main touching only crates/plateforce-batch could move what Python reports
    # without building a wheel or running one Python test. Pull requests were always covered,
    # because the pull_request trigger below carries no paths filter. Pushes were not.
    #
    # The same query over r-package.yml came back empty: the R binding vendors analysis, core
    # and registry and not batch, and that workflow lists exactly those three. The reading of
    # desktop-linux.yml recorded here was wrong, and is corrected rather than deleted because
    # the mistake is the instructive part. plateforce-serve does depend on no workspace crate,
    # but that workflow builds plateforce-cli, whose closure is five, so four crates could
    # move the static binaries without it running. Naming the root by what a workflow is about
    # rather than by what it builds is how a closure comes out empty and a row asserts nothing.
    paths:
      - "crates/plateforce-analysis/**"
      - "crates/plateforce-batch/**"
      - "crates/plateforce-core/**"
      - "crates/plateforce-registry/**"
      - "crates/plateforce-python/**"
      - "registry/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/check-wheel-set.py"
      - "scripts/check-sdist-carries-registry.py"
      - "scripts/smoke-installed-wheel.py"
      - ".github/workflows/python-wheels.yml"
  pull_request:
  workflow_dispatch:

# Pull request code compiles here, and a build script runs at compile time. Reading the
# checkout is the whole of what that code needs.
permissions:
  contents: read

jobs:
  targets:
    name: the platforms that ship
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.declare.outputs.platforms }}
    steps:
      # Declared once and read twice: the build matrix below builds this list, and the
      # verify job counts what arrived against it. A leg cannot vanish from the build and
      # from the expectation in the same edit.
      #
      # Intel macOS runs on macos-15-intel; it is the last x86_64 macOS image Actions
      # offers and it retires in August 2027, after which this target needs
      # cross-compilation or dropping.
      - name: Declare the platforms
        id: declare
        run: |
          cat >platforms.json <<'JSON'
          [
            {"platform": "manylinux x86_64",  "runner": "ubuntu-24.04",     "wheel_tag": "manylinux*_x86_64*"},
            {"platform": "manylinux aarch64", "runner": "ubuntu-24.04-arm", "wheel_tag": "manylinux*_aarch64*"},
            {"platform": "macos x86_64",      "runner": "macos-15-intel",   "wheel_tag": "macosx_*_x86_64"},
            {"platform": "macos arm64",       "runner": "macos-14",         "wheel_tag": "macosx_*_arm64"},
            {"platform": "windows AMD64",     "runner": "windows-2022",     "wheel_tag": "win_amd64"}
          ]
          JSON
          echo "platforms=$(jq -c . platforms.json)" >> "$GITHUB_OUTPUT"

  sdist:
    name: source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # maturin carries the workspace root and the sibling crates, which is why the engine
      # compiles inside the tarball. The registry is a directory rather than a crate, so
      # nothing carried it and `build.rs` read a path that was not there. It has to be
      # inside the package: maturin's include resolves against the crate root and refuses
      # a path containing `..`.
      - name: Copy the registry into the package
        run: sh crates/plateforce-python/tools/vendor-registry.sh

      # The crate is a workspace member, so the sdist has to carry the workspace root and
      # the sibling crates. maturin resolves that; every wheel below is then built from
      # this one artefact, which is also what proves the sdist is complete.
      - name: Build the source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path crates/plateforce-python/Cargo.toml

      # The wheel jobs prove this too, by failing, six minutes later on five platforms at
      # once and with a Rust panic about a path. This says the same thing in seconds and
      # names the file count and the script that fixes it.
      - name: The source distribution carries the registry it will be built against
        run: python3 scripts/check-sdist-carries-registry.py dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: ${{ matrix.platform }}
    needs: [targets, sdist]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.platforms) }}

    steps:
      # No checkout. Every input is the source distribution, so a file missing from it
      # fails here rather than after release.
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Locate the source distribution
        shell: bash
        run: echo "SDIST=$(ls dist/*.tar.gz)" >> "$GITHUB_ENV"

      # No config-file argument. Building from a tarball, cibuildwheel extracts it and
      # changes into the extracted directory, so a relative config path would resolve
      # against the sdist rather than the checkout. It reads the sdist's own
      # pyproject.toml, which is the one that ships.
      - name: Build and test the wheel
        uses: pypa/cibuildwheel@v4.1.1
        with:
          package-dir: ${{ env.SDIST }}
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.runner }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  verify:
    name: one wheel per platform, no compiler needed
    needs: [targets, wheels]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true

      # Counted against the declared platforms rather than inspected one by one. A dropped
      # matrix leg leaves the tags of the wheels that did arrive perfectly valid, so a check
      # that only reads what is present reports a release that is missing a platform as
      # sound. A cp312-cp312 tag means the stable ABI was switched off and the matrix has
      # gone back to one wheel per interpreter.
      - name: Check one abi3 wheel arrived for every platform
        env:
          PLATFORMS: ${{ needs.targets.outputs.platforms }}
        run: python3 scripts/check-wheel-set.py "$PLATFORMS" wheelhouse

  install:
    name: pip install on python ${{ matrix.python }}
    needs: wheels
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The oldest interpreter the wheel claims and a later one. One wheel serving both
        # is the abi3 claim, tested rather than asserted.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-24.04
          path: wheelhouse

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install numpy wheelhouse/*.whl

      # Handed nothing. The script moves to an empty directory before it loads anything, so
      # a pass says the wheel carries its own registry rather than that this runner happened
      # to have a checkout beside it. Passing `registry` here, which is what this step used
      # to do, proves the wheel works when given files it did not ship.
      - name: Analyse a trial with nothing but the wheel
        run: /tmp/clean/bin/python scripts/smoke-installed-wheel.py

      # And the registry it carries is this commit's, compared by digest. A wheel built
      # against an older registry computes correct numbers and attributes them to bytes
      # that are not the ones in this tree, which is the failure this project publishes
      # about, in our own release.
      - name: The registry in the wheel is the registry in this tree
        run: /tmp/clean/bin/python scripts/smoke-installed-wheel.py registry

  # The one job here that publishes, and the header above this file says nothing here does,
  # which was true until this job existed. `pip install plateforce` is a route CHANGELOG.md
  # and the guides tell a reader to take, so a release that builds the wheel and does not
  # publish it points them at a route that is not there.
  #
  # needs both proving jobs rather than `wheels`: `verify` is what says one abi3 wheel arrived
  # for every declared platform, and `install` is what says the thing installs into a clean
  # environment and carries this tree's registry. Publishing on `wheels` alone would upload a
  # set that a dropped matrix leg had quietly shortened.
  publish:
    name: publish to PyPI
    # A tag, and nothing else. Every job above runs on a push to main and on a dispatch, so
    # the whole route can be rehearsed without uploading anything, which is the same property
    # `draft` gives the release workflow.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify, install]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # twine rather than an action, for the reason desktop-linux.yml installs the Tauri CLI
      # rather than taking one: the version that uploads a release is then this file's choice
      # and not a moving branch ref in somebody else's repository.
      - name: Install twine
        run: python3 -m pip install --upgrade twine

      - name: What is about to be uploaded
        run: ls -la dist/

      # Reads the metadata inside each distribution and refuses one PyPI would reject, before
      # any of them is uploaded. A partial upload is the awkward state here, because the first
      # file to land takes the version and a second attempt cannot replace it.
      - name: The distributions are well formed
        run: python3 -m twine check dist/*

      # No --skip-existing. On a first publish it would turn "this name belongs to somebody
      # else" into a silent pass, and that is the one failure worth stopping for. A retry
      # after a partial upload is a person running twine with --skip-existing by hand.
      - name: Upload
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python3 -m twine upload --non-interactive dist/*
