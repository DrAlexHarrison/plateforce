name: desktop, Windows

# Two routes and both cost nothing. The direct download is the primary one: the Store
# excludes Windows LTSC, which has no Store by design and is what clinical acquisition rigs
# run, plus Enterprise and Education fleets with the Store policy set, and the Store lags
# every direct release by a certification cycle, permanently.
#
# No paid signing. Microsoft states that an Extended Validation certificate no longer buys
# instant SmartScreen reputation, and that reputation takes several weeks and hundreds of
# clean installs from a wide audience, which a niche research tool will not reach. A
# certificate would leave the warning in place and change only the publisher name inside it.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  TAURI_CLI_VERSION: "2.11.4"

jobs:
  installer:
    name: the direct download
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-tauri.exe
            ~/.cargo/bin/wasm-bindgen.exe
            target
            src-tauri/target
          key: desktop-windows-${{ env.TAURI_CLI_VERSION }}-${{ hashFiles('src-tauri/Cargo.lock', 'Cargo.lock') }}
          restore-keys: |
            desktop-windows-${{ env.TAURI_CLI_VERSION }}-

      - name: Install the Tauri CLI
        shell: bash
        run: |
          if [ ! -x "$HOME/.cargo/bin/cargo-tauri.exe" ]; then
            cargo install tauri-cli --locked --version "$TAURI_CLI_VERSION"
          fi

      # installMode currentUser puts it in %LOCALAPPDATA% and needs no administrator, which
      # is what a researcher on a managed university laptop can actually do. MSI is not
      # built at all: it has no per-user install mode.
      # The cache restores the target directory, and its fallback key reaches any earlier
      # run, so the previous release's bundles arrive with it. Their names carry the version
      # they were built for, so they are not overwritten, and every step below that reads
      # "the bundle" would be choosing between two releases.
      - name: Nothing but this release's bundles
        run: rm -rf src-tauri/target/release/bundle

      - name: Build the installer
        run: cargo tauri build --bundles nsis

      - name: The module inside the bundle is the one this tree builds
        shell: bash
        run: bash scripts/verify-release-artefacts.sh --bundle-wasm-only

      # The command line program, which the installer does not contain: tauri.conf.json
      # declares no externalBin and the executable it installs is plateforce-desktop, so
      # without this a reader at a PowerShell prompt has nothing to run and no route that does
      # not need a compiler.
      #
      # After the bundle build, because that build's beforeBuildCommand is what put web/pkg on
      # disk, and plateforce-cli embeds web/ at compile time.
      - name: The command line program
        shell: bash
        run: |
          test -f web/pkg/plateforce_wasm_bg.wasm
          cargo build --release -p plateforce-cli

      - name: Gather the artefacts
        shell: bash
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/nsis/*-setup.exe dist/
          cp target/release/plateforce.exe dist/plateforce-x86_64-windows.exe

      - name: It carries the browser build
        shell: bash
        run: bash scripts/verify-release-artefacts.sh --cli-payload-only dist/plateforce-x86_64-windows.exe

      # The step above this one reads the loose executable the build produced. This extracts
      # the installer and asks the program inside it, which is a different question: it is
      # the copy a reader actually runs. It stays in this job because the comparison is
      # against this job's web/pkg, and the module is not byte-reproducible across runners.
      - name: What the installer carries
        shell: bash
        run: bash scripts/verify-windows-artefact.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            dist/*-setup.exe
            dist/plateforce-x86_64-windows.exe
          if-no-files-found: error

  store-package:
    name: the Store package, submission-ready
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-tauri.exe
            ~/.cargo/bin/wasm-bindgen.exe
            target
            src-tauri/target
          key: desktop-windows-${{ env.TAURI_CLI_VERSION }}-${{ hashFiles('src-tauri/Cargo.lock', 'Cargo.lock') }}
          restore-keys: |
            desktop-windows-${{ env.TAURI_CLI_VERSION }}-

      - name: Install the Tauri CLI
        shell: bash
        run: |
          if [ ! -x "$HOME/.cargo/bin/cargo-tauri.exe" ]; then
            cargo install tauri-cli --locked --version "$TAURI_CLI_VERSION"
          fi

      # The packaging script runs only on a release with the Store identity set, so a syntax
      # error in it would otherwise surface for the first time during a release. Parsing
      # costs nothing and needs no identity.
      - name: The packaging script parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./scripts/build-msix.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Output "scripts/build-msix.ps1 parses"

      # The Store overlay builds no installer, since makeappx packages the program itself,
      # and skips the WebView2 bootstrapper, which a package may not carry.
      - name: Build the program the package wraps
        run: cargo tauri build --config src-tauri/tauri.store.conf.json --no-bundle

      # Read from the `vars` context rather than through a step's own `env` block. A step's
      # `if` is evaluated before that step's `env` is applied, so `env.STORE_IDENTITY_NAME`
      # was empty whatever the repository variable held, and these four steps would have
      # gone on skipping after somebody registered the account and set it.
      - name: Package it with the Windows SDK's own tool
        if: vars.STORE_IDENTITY_NAME != ''
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
        shell: pwsh
        run: |
          ./scripts/build-msix.ps1 `
            -IdentityName $env:STORE_IDENTITY_NAME `
            -Publisher $env:STORE_PUBLISHER `
            -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME

      # Stops at submission-ready. Registration, the identity verification and the written
      # justification for the runFullTrust restricted capability are done once, by hand, by
      # the person whose name the listing carries.
      - name: What is left to do by hand
        if: vars.STORE_IDENTITY_NAME != ''
        shell: bash
        run: |
          {
            echo "### The Store package is built and unsigned"
            echo ""
            echo "It is unsigned on purpose: the Store re-signs it with a Microsoft"
            echo "certificate after certification, and signing it first fails validation."
            echo ""
            echo "One step remains, done once. The account and the reserved identity are"
            echo "already behind the variables that let this package be built:"
            echo ""
            echo "Write the justification for the runFullTrust restricted capability in"
            echo "Submission Options on the first submission."
            echo ""
            echo "Certification then takes one to five business days."
          } >> "$GITHUB_STEP_SUMMARY"

      # Unpacks the package and asks the program inside it, against this job's web/pkg for
      # the same reason the installer job checks its own.
      - name: What the Store package carries
        if: vars.STORE_IDENTITY_NAME != ''
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
        shell: bash
        run: bash scripts/verify-windows-artefact.sh dist

      - uses: actions/upload-artifact@v4
        if: vars.STORE_IDENTITY_NAME != ''
        with:
          name: store-package
          path: dist/*.msix
          if-no-files-found: error

      # Always, and last. Without it this job reports success from a run that packaged
      # nothing, because every step that produces the package is behind a variable that is
      # empty until a package identity is reserved. A green check that carries no artefact
      # and says nothing reads exactly like a green check that carries one.
      - name: Say which of the two happened
        if: always()
        shell: bash
        env:
          IDENTITY: ${{ vars.STORE_IDENTITY_NAME }}
        run: |
          if [ -n "$IDENTITY" ]; then
            echo "packaged under the identity $IDENTITY" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### No Store package was built"
              echo ""
              echo "The program the package wraps was built and the packaging script was"
              echo "parsed. Packaging needs a reserved identity, which lives in three"
              echo "repository variables: STORE_IDENTITY_NAME, STORE_PUBLISHER and"
              echo "STORE_PUBLISHER_DISPLAY_NAME. Partner Center issues those values when a"
              echo "package identity is reserved, and the release runbook carries the route."
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

