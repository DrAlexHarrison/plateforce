name: the committed tree is the tree

# A module declared but not committed compiles for everyone who has the file sitting
# untracked beside them, and fails for anyone who clones. Several agents share one checkout
# and all have the file; CI and a new contributor do not.
#
# Measured over the 40 commits before this job existed: 16 of them did not build from a clean
# checkout, across two outages, one of 9 commits and one of 7. Every local tree was green
# throughout both.
#
# This runs in seconds and reads only what git holds, so it can also be run before a push:
#
#   python3 scripts/verify-committed-tree.py HEAD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  declared-modules-are-committed:
    name: every declared module is committed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Read the ref rather than the working tree
        run: python3 scripts/verify-committed-tree.py HEAD

  # The licence tables name every package that ships and are generated rather than kept by
  # hand, so nothing but a run of the generator can tell whether they still describe the
  # tree. Pull request time rather than release time: a release gate stops a stale table
  # shipping, and this stops one merging.
  the_licence_tables_describe_what_ships:
    name: NOTICE names the dependencies the tree resolves
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal

      # Exits 1 on a table that has drifted and 0 on one that has not, watched both ways
      # against this ref before the job was written.
      - name: Ask the generator whether the committed tables are current
        run: python3 scripts/write-dependency-licences.py --check

  every_workspace_reads_a_double_back_as_itself:
    name: serde_json resolves with float_roundtrip everywhere
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal

      # The resolved feature graph rather than the tests. Removing the root declaration does
      # redden four tests, so the workspace is covered; removing it from the desktop shell
      # reddens nothing at all, because that package sits outside the workspace suite and its
      # own tests carry no double. Measured both ways. This asks all three workspaces.
      - name: Every workspace that ships
        run: bash scripts/verify-float-roundtrip.sh

  # A gate that does not run is a gate that passed, and a `paths:` filter is a hand-written
  # claim about a dependency graph that nobody re-reads when the graph moves. Twice in two
  # days the same workflow shipped a hole: `crates/plateforce-analysis/**` was missing until
  # 20519b5 and `crates/plateforce-batch/**` until this job existed, one crate over from that
  # fix. Both let a push to main move every number Python reports while the job that tests
  # Python sat out. This job lives here rather than beside them because it must run on a push
  # that touches only a workflow file, which every filtered workflow by definition does not.
  a_gate_runs_on_every_change_that_could_move_it:
    name: each path filter covers its own dependency closure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # cargo metadata reads the manifests, so the toolchain is the whole requirement.
      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal

      # Watched red before it was watched green: with the batch line deleted the run named
      # the crate, the workflow and the line to add, and exited 1.
      - name: Ask the manifests what each workflow depends on
        run: python3 scripts/check-workflow-crate-paths.py

  # Both read the documents against the registry and neither needs a toolchain, so they share
  # a runner. A document is the one surface with no test behind it: nothing fails when a page
  # goes stale, and a reader who follows a wrong one has no way to tell.
  the_documents_describe_the_tree:
    name: the documents describe the registry the tree carries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # A count written into prose is right on the day it is typed and wrong the first time a
      # rule lands, and nothing about the page says which of the two a reader is holding.
      - name: No page states a count the registry owns
        run: python3 scripts/check-docs-state-no-rule-counts.py

      # The contract page is what a reader writes a registry file against, so a key it spells
      # wrong is not a documentation defect, it is a file that will not load.
      - name: Every key and table the registry uses is shown in the schema
        run: python3 scripts/check-schema-doc-covers-registry.py
