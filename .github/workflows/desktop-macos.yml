name: desktop, macOS

# One universal DMG, signed with a Developer ID certificate and notarised, so a reader
# drags plateforce to Applications and sees no warning of any kind.
#
# workflow_call and workflow_dispatch only. This job needs secrets a fork cannot have, and
# its payload check is the same digest comparison the Linux job already runs on every pull
# request.

on:
  workflow_call:
    inputs:
      must_be_signed:
        description: Refuse the ad-hoc path, for a run whose artefact reaches a reader.
        type: boolean
        default: false
  # The same switch by hand, so the signing path can be run once before a tag runs it.
  # Only a tag sets it on the release route, and a tag is created once and deleted with
  # difficulty, so without this the first execution of the signing and notarisation path
  # is also the release. Dispatching this with the box ticked makes the tag the second.
  workflow_dispatch:
    inputs:
      must_be_signed:
        description: Refuse the ad-hoc path. Tick this to rehearse the signed release.
        type: boolean
        default: false

permissions:
  contents: read

env:
  TAURI_CLI_VERSION: "2.11.4"
  # Roughly twenty minutes of Apple's service being unavailable. 2026 has had multi-day
  # notarisation incidents, and a release should be delayed by one rather than lose the
  # signed binary it spent twenty minutes producing.
  NOTARISATION_ATTEMPTS: "5"

jobs:
  dmg:
    name: universal DMG
    # macos-14 is arm64. Both architectures are built here and lipo'd into one artefact by
    # Tauri, which avoids macos-15-intel, the last x86_64 image Actions offers and the one
    # retiring in August 2027. The documented universal-build failures are on x86 hosts and
    # on OpenSSL cross-compilation, and this tree links no OpenSSL.
    runs-on: macos-14
    steps:
      # First, because it needs nothing but the secrets and it can end the run. Behind the
      # toolchain it costs a cold `cargo install tauri-cli` before saying what it could have
      # said in two seconds.
      #
      # A contributor's pull request is not given the signing secrets, and failing them at
      # the signing step would report a problem that has nothing to do with their change.
      # Which path ran is logged, so a release that quietly went out unsigned is visible.
      #
      # All six inputs are read rather than the three the build step names. A certificate
      # without an identity signs as whatever the certificate happens to be, and an identity
      # without a certificate reaches Tauri as an instruction to import one that is not
      # there, which surfaces as `security import: failed to import keychain certificate`
      # and reads like a broken certificate rather than a missing one. The other three are
      # the notarisation step's, and a run that reaches it without them has already built
      # both architectures and signed them, then spends five attempts and roughly twenty
      # minutes on a submission that cannot authenticate.
      - name: Decide whether this run can sign
        id: signing
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          API_KEY_CONTENTS: ${{ secrets.APPLE_API_KEY_CONTENTS }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MUST_BE_SIGNED: ${{ inputs.must_be_signed }}
        run: |
          absent=""
          present=0
          # Actions materialises an absent secret as an empty string rather than leaving the
          # variable unset, so emptiness is what separates the two.
          note() {
            if [ -n "$2" ]; then present=$((present + 1)); else absent="$absent $1"; fi
          }
          note APPLE_SIGNING_IDENTITY "$IDENTITY"
          note APPLE_CERTIFICATE "$CERTIFICATE"
          note APPLE_CERTIFICATE_PASSWORD "$CERTIFICATE_PASSWORD"
          note APPLE_API_KEY_CONTENTS "$API_KEY_CONTENTS"
          note APPLE_API_KEY "$API_KEY"
          note APPLE_API_ISSUER "$API_ISSUER"
          if [ "$present" -eq 6 ]; then
            echo "able=yes" >> "$GITHUB_OUTPUT"
            echo "signing: Developer ID, notarisation to follow"
          elif [ "$present" -eq 0 ]; then
            if [ "$MUST_BE_SIGNED" = true ]; then
              echo "signing: declined. This artefact reaches a reader, who is told it" >&2
              echo "opens with no warning, and no signing credentials are set." >&2
              exit 1
            fi
            echo "able=no" >> "$GITHUB_OUTPUT"
            echo "signing: ad-hoc, notarisation skipped"
          else
            echo "signing: declined, the credentials are incomplete." >&2
            echo "absent:$absent" >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install the Rust toolchain and both architectures
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/wasm-bindgen
            target
            src-tauri/target
          key: desktop-macos-${{ env.TAURI_CLI_VERSION }}-${{ hashFiles('src-tauri/Cargo.lock', 'Cargo.lock') }}
          restore-keys: |
            desktop-macos-${{ env.TAURI_CLI_VERSION }}-

      - name: Install the Tauri CLI
        run: |
          if [ ! -x "$HOME/.cargo/bin/cargo-tauri" ]; then
            cargo install tauri-cli --locked --version "$TAURI_CLI_VERSION"
          fi

      - name: Write the App Store Connect key
        if: steps.signing.outputs.able == 'yes'
        env:
          KEY: ${{ secrets.APPLE_API_KEY_CONTENTS }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple-api-key.p8
        run: |
          printf '%s' "$KEY" > "$APPLE_API_KEY_PATH"
          chmod 600 "$APPLE_API_KEY_PATH"

      # Tauri notarises by itself when the App Store Connect variables are in its
      # environment, and it does not retry. They are deliberately withheld here so signing
      # and notarisation are separate steps and the second one can be retried against the
      # binary the first produced rather than against a rebuilt one.
      #
      # The certificate reaches this step under names Tauri does not read, and takes the
      # names it does read only on the branch that has a certificate. Actions materialises
      # an absent secret as an empty string rather than leaving the variable unset, and
      # tauri-bundler's keychain() branches on whether APPLE_CERTIFICATE is present rather
      # than on whether it holds anything, so naming it unconditionally sends the ad-hoc
      # path into an import with nothing to import.
      - name: Build and sign
        env:
          SIGNING_ABLE: ${{ steps.signing.outputs.able }}
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ "$SIGNING_ABLE" = yes ]; then
            export APPLE_CERTIFICATE="$CERTIFICATE"
            export APPLE_CERTIFICATE_PASSWORD="$CERTIFICATE_PASSWORD"
            export APPLE_SIGNING_IDENTITY="$IDENTITY"
          else
            export APPLE_SIGNING_IDENTITY="-"
          fi
          if [ -n "${APPLE_CERTIFICATE+defined}" ]; then
            echo "APPLE_CERTIFICATE reaches the build: yes"
          else
            echo "APPLE_CERTIFICATE reaches the build: no"
          fi
          cargo tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Both architectures are in the one binary
        run: |
          application="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos \
            -maxdepth 1 -name '*.app' | head -1)"
          lipo -info "$application/Contents/MacOS/plateforce-desktop"

      - name: The module inside the bundle is the one this tree builds
        run: bash scripts/verify-release-artefacts.sh --bundle-wasm-only

      # The command line program, which the application does not contain: tauri.conf.json
      # declares no externalBin and the executable inside the app is plateforce-desktop, so
      # without this a reader at a terminal on macOS has nothing to run and no route that
      # does not need a compiler.
      #
      # After the bundle build rather than before it, because that build's beforeBuildCommand
      # is what put web/pkg on disk, and plateforce-cli embeds web/ at compile time.
      - name: The command line program, both architectures in one file
        run: |
          test -f web/pkg/plateforce_wasm_bg.wasm
          cargo build --release -p plateforce-cli --target aarch64-apple-darwin
          cargo build --release -p plateforce-cli --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/plateforce-universal-macos \
            target/aarch64-apple-darwin/release/plateforce \
            target/x86_64-apple-darwin/release/plateforce
          lipo -info dist/plateforce-universal-macos

      - name: It carries the browser build
        run: bash scripts/verify-release-artefacts.sh --cli-payload-only dist/plateforce-universal-macos

      # Signed, not notarised, and the difference decides what a reader has to do. Gatekeeper
      # reads the quarantine attribute, which the downloading application sets: a browser sets
      # it and curl does not. So a signed and un-notarised binary fetched with curl runs with
      # no prompt, and the same file downloaded in a browser is refused until the reader clears
      # the attribute. Notarisation applies to an archive or a bundle rather than to a loose
      # executable, so it is a separate submission from the one the dmg makes above.
      # The bundler imports the certificate into a keychain of its own and takes it away again,
      # so by here the identity that signed the application is gone and codesign reports it as
      # absent from the keychain rather than as a signing failure. This step keeps its own.
      - name: Sign it with the same identity as the application
        if: steps.signing.outputs.able == 'yes'
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/plateforce-signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          # Without the partition list codesign prompts for keychain access, which on a runner
          # is an eleven minute wait and then a timeout rather than a refusal.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          codesign --force --timestamp --options runtime --keychain "$keychain" \
            --sign "$IDENTITY" dist/plateforce-universal-macos
          codesign --verify --verbose dist/plateforce-universal-macos
          security delete-keychain "$keychain"

      - name: Notarise, and staple the ticket into the file
        if: steps.signing.outputs.able == 'yes'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple-api-key.p8
        run: |
          image="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg \
            -name '*.dmg' | head -1)"
          attempt=1
          until xcrun notarytool submit "$image" \
                  --key "$APPLE_API_KEY_PATH" \
                  --key-id "$APPLE_API_KEY" \
                  --issuer "$APPLE_API_ISSUER" \
                  --wait --timeout 30m 2>&1 | tee submission.log; do
            if [ "$attempt" -ge "$NOTARISATION_ATTEMPTS" ]; then
              echo "notarisation did not complete in $attempt attempts" >&2
              grep -oE 'id: [0-9a-f-]+' submission.log | head -1 >&2 || true
              echo "the signed artefact is uploaded below and can be notarised and stapled" >&2
              echo "by hand against this same binary rather than a rebuilt one" >&2
              exit 1
            fi
            echo "notarisation attempt $attempt did not complete, waiting"
            sleep $((attempt * 60))
            attempt=$((attempt + 1))
          done
          xcrun stapler staple "$image"

      - name: Ask the three questions Gatekeeper asks
        if: steps.signing.outputs.able == 'yes'
        run: |
          image="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg \
            -name '*.dmg' | head -1)"
          bash scripts/verify-macos-artefact.sh "$image"

      # The half an unsigned build can answer, run so that the first signed release is not
      # also the first time anything opened one of these images.
      - name: The image mounts and carries an application
        if: steps.signing.outputs.able == 'no'
        run: |
          image="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg \
            -name '*.dmg' | head -1)"
          bash scripts/verify-macos-artefact.sh "$image" --mounts-only

      # Runs whether the notarisation succeeded or ran out of attempts, so the signed binary
      # survives an Apple outage. Not when the signing decision itself failed: there is no
      # binary then, and this step's "No files were found" becomes the loudest line in the
      # log, which sends a reader looking for a broken build when the cause is a credential
      # that was never set. `if-no-files-found: error` stays, so a build that ran and
      # produced nothing still fails here.
      - uses: actions/upload-artifact@v4
        if: always() && steps.signing.outcome == 'success'
        with:
          name: desktop-macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            dist/plateforce-universal-macos
          if-no-files-found: error

      - name: Remove the App Store Connect key
        if: always()
        env:
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple-api-key.p8
        run: rm -f "$APPLE_API_KEY_PATH"
