name: every surface says the same about itself

# The manifest asserts over surfaces, so a job that builds one of them proves nothing. Every
# row in scripts/capability-surfaces.txt is asked here, which is why this job installs the R
# package and builds the Python wheel rather than only compiling the workspace. A surface that
# cannot answer fails the job and is never skipped, so a missing install cannot let the gate
# pass with fewer surfaces than it names.
#
# Two questions, and they are not the same question. What a surface says it can do is the
# manifest gate. What it computes is the result gate, and that is the claim a reader acts on:
# the number pasted into a paper comes from one of these surfaces and a reader has no way to
# tell which. They share this job because both need every surface built and the R package
# installed, and running that twice buys nothing.
#
# Every input the answers depend on, including this file, so a push that edits only the gate
# still has to meet it.
on:
  push:
    branches: [main]
    paths:
      - 'CAPABILITY.json'
      - 'scripts/capability*'
      - 'scripts/result*'
      - 'tests/golden/**'
      - 'bindings/**'
      - 'crates/**'
      - 'registry/**'
      - 'scripts/build-web.sh'
      - 'scripts/check-batch.mjs'
      - 'scripts/check-grammar.mjs'
      - 'scripts/check-web-names-no-construct.py'
      - 'scripts/check-web-reads-live-fields.py'
      - 'web/**'
      - '.github/workflows/parity.yml'
  pull_request:
    paths:
      - 'CAPABILITY.json'
      - 'scripts/capability*'
      - 'scripts/result*'
      - 'tests/golden/**'
      - 'bindings/**'
      - 'crates/**'
      - 'registry/**'
      - 'scripts/build-web.sh'
      - 'scripts/check-batch.mjs'
      - 'scripts/check-grammar.mjs'
      - 'scripts/check-web-names-no-construct.py'
      - 'scripts/check-web-reads-live-fields.py'
      - 'web/**'
      - '.github/workflows/parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability:
    name: what each surface reports about itself, and what each one computes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: parity-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            parity-

      # The Python rows build and install the wheel themselves, in
      # scripts/install-python-wheel.sh, so both answer for this commit rather than for
      # whatever is importable on the runner. What this names is the interpreter: the wheel
      # declares 3.11 as its floor and CI is where a floor is worth asking rather than
      # assuming, since the image ships a later one.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Named here rather than left to the rows to fetch, so a build tool that will not
      # install fails as itself instead of inside a gate about surfaces disagreeing.
      - name: Install maturin, so the Python rows can build the wheel they ask
        run: python3 -m pip install maturin

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: bindings/r

      # The package vendors a copy of the engine, and its own vendoring step refreshes that
      # copy only when it is absent. Asking for it here is what makes the R row report this
      # commit's engine rather than whichever one was copied first.
      - name: Copy the engine and the registry into the package
        run: bash bindings/r/tools/sync-engine.sh

      - name: Install the R package, so its row can answer
        run: R CMD INSTALL bindings/r

      - name: Every listed surface reports, and every answer meets the obligation
        run: ./scripts/capability.sh --check

      # The only gate here that compares a computed number rather than a manifest. Two
      # surfaces can publish identical vocabularies and return different jump heights, and
      # nothing above this line can see that.
      - name: Every listed surface computes the one committed request to the same numbers
        run: ./scripts/result-parity.sh --check

      # A field the engine renames and migrates across its Rust callers leaves the browser
      # reading a name that is gone, which renders as an empty string rather than as an
      # error. That is a disagreement between two surfaces, so it is asked here.
      - name: The browser reads only fields the engine still serialises
        run: python3 scripts/check-web-reads-live-fields.py

      # The browser and the terminal are asked the same question about the same trials, by
      # driving the page rather than by calling its modules: an answer a surface exports and
      # has no path to is an answer it cannot give.
      - name: A folder through the browser equals the same folder through the terminal
        run: node scripts/check-batch.mjs web 8751

      # Adding a method is a data edit, so a construct written into the interface is a row
      # the registry can no longer add or remove on its own.
      - name: The interface writes down no construct the registry declares
        run: python3 scripts/check-web-names-no-construct.py

      - name: The rail is a query against the registry, not a list
        run: node scripts/check-grammar.mjs web 8791
