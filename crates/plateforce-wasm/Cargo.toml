[package]
name = "plateforce-wasm"
description = "WebAssembly bindings. The browser build runs the same compiled logic as the desktop."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
plateforce-analysis = { workspace = true }
plateforce-core = { workspace = true }
plateforce-registry = { workspace = true }
serde = { workspace = true }
# The workspace entry carries `float_roundtrip`. This crate parses the browser's request,
# so the bare version would read back a different double from the one the tab wrote on
# roughly one value in ten, and only for callers whose build happened not to enable it.
serde_json = { workspace = true }

# Exact, because the generated bindings only load against the matching wasm-bindgen CLI,
# and `pages.yml` reads this line to install it. No feature selected here pulls in threads:
# the browser build has to stay servable from static hosting with no isolation headers.
wasm-bindgen = { version = "=0.2.117", default-features = false, features = ["std"] }

# The build script walks and assembles the registry through the same crate the desktop
# loader uses, so what it embeds cannot drift from what a directory would load.
[build-dependencies]
plateforce-registry = { workspace = true }

[package.metadata.docs.rs]
targets = ["wasm32-unknown-unknown"]
