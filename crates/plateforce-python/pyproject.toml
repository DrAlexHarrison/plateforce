[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "plateforce"
description = "Force-plate kinetic analysis where every result carries the method that produced it."
readme = "README.md"
# An SPDX expression rather than the table form, which PEP 639 replaced, and no
# `License ::` classifier beside it, which the same specification retired. The pair is
# what a package index reads to say what a user may do with this.
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Alex Harrison" }]
keywords = ["biomechanics", "force-plate", "countermovement-jump", "sports-science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
]

# 3.11 rather than a lower floor, for two reasons that point the same way. Py_buffer
# entered the stable ABI in 3.11, which is what lets an array be read with no numpy
# dependency at all. And the array libraries this audience already runs have moved past
# it: numpy 2.5 and scipy 1.18 require 3.12, pandas 3.0 requires 3.11.
requires-python = ">=3.11"
dynamic = ["version"]

# Every link a package index puts in its sidebar. A reader who arrives at the index page
# from a citation follows these to check what produced a number, so the installation
# routes and the schema the fingerprint is written against are named rather than left in
# the repository for somebody to find.
[project.urls]
Homepage = "https://github.com/DrAlexHarrison/plateforce"
Repository = "https://github.com/DrAlexHarrison/plateforce"
Issues = "https://github.com/DrAlexHarrison/plateforce/issues"
Documentation = "https://github.com/DrAlexHarrison/plateforce/blob/main/docs/schema.md"
"Browser build" = "https://dralexharrison.github.io/plateforce"

[tool.maturin]
# One wheel per platform rather than one per interpreter. The extension links the
# stable ABI, so a single cp311-abi3 wheel serves 3.11 and every later version.
features = ["pyo3/extension-module"]

# The registry, which `build.rs` reads at compile time and embeds. maturin carries the
# workspace root and the sibling crates into the sdist, but the registry is a directory
# rather than a crate, so without this every wheel built from the sdist died in `build.rs`.
# The path resolves against this directory and maturin refuses one containing `..`, so
# `tools/vendor-registry.sh` puts a copy here first and this carries it.
#
# sdist only. The wheel has the registry compiled into the extension, so shipping the TOML
# beside it would put a second copy in every wheel that nothing reads.
include = [{ path = "registry/**/*", format = "sdist" }]


[tool.cibuildwheel]
# Building on the oldest supported interpreter is what collapses the matrix: the wheel
# this produces is tagged cp311-abi3 and installs on every later version, so the release
# is five wheels, one per platform, rather than one per platform per Python version.
build = "cp311-*"
# musl and 32-bit are off because Rust ships no cargo for 32-bit musl and this audience is
# not on either. Adding musl back is one edit to this line. No `pp*`: PyPy is not an enabled
# group, so naming it here only earns a warning on every wheel job.
skip = "*-musllinux_* *_i686 *_ppc64le *_s390x"
build-frontend = "build"
test-requires = ["pytest", "numpy"]
test-command = "pytest {project}/crates/plateforce-python/tests"

[tool.cibuildwheel.linux]
# Native only, as on macOS. Naming both architectures here builds the other one under QEMU
# on whichever runner picks the file up, which takes tens of minutes to produce a wheel the
# sibling job already built. The runner matrix names the set that ships.
archs = ["auto"]
# The manylinux images carry no Rust toolchain.
before-all = "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos]
archs = ["native"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

# Rust targets macOS 10.12 at the oldest, above CPython's own floor, so the wheel has to
# say so or it claims compatibility it does not have. Apple Silicon starts at 11.0 and
# cibuildwheel sets that itself.
[[tool.cibuildwheel.overrides]]
select = "*-macosx_x86_64"
environment = { MACOSX_DEPLOYMENT_TARGET = "10.13" }
