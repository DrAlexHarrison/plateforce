[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "plateforce"
description = "Force-plate kinetic analysis where every result carries the method that produced it."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Alex Harrison" }]
keywords = ["biomechanics", "force-plate", "countermovement-jump", "sports-science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
]

# 3.11 rather than a lower floor, for two reasons that point the same way. Py_buffer
# entered the stable ABI in 3.11, which is what lets an array be read with no numpy
# dependency at all. And the array libraries this audience already runs have moved past
# it: numpy 2.5 and scipy 1.18 require 3.12, pandas 3.0 requires 3.11.
requires-python = ">=3.11"
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/DrAlexHarrison/plateforce"

[tool.maturin]
# One wheel per platform rather than one per interpreter. The extension links the
# stable ABI, so a single cp311-abi3 wheel serves 3.11 and every later version.
features = ["pyo3/extension-module"]
