[package]
name = "plateforce-python"
description = "Python bindings, built as an abi3 wheel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "plateforce"
crate-type = ["cdylib", "rlib"]

[dependencies]
plateforce-core = { workspace = true }
plateforce-registry = { workspace = true }

# 0.27 is the newest pyo3 whose MSRV is 1.74 and so fits under the workspace floor of
# 1.75. 0.28 and 0.29 require 1.83. abi3-py311 rather than a lower floor because
# Py_buffer entered the stable ABI in 3.11, which is what lets an array be read
# without a numpy dependency.
pyo3 = { version = "0.29.0", features = ["abi3-py311"] }
