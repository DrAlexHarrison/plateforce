[package]
name = "plateforce-python"
description = "Python bindings, built as an abi3 wheel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "plateforce"
crate-type = ["cdylib", "rlib"]

[dependencies]
plateforce-analysis = { workspace = true }
plateforce-core = { workspace = true }
plateforce-registry = { workspace = true }

# 0.29 is the first release carrying the fix for GHSA-36hh-v3qg-5jq4, an out-of-bounds
# read in the PyList and PyTuple iterators, and it requires rustc 1.83. abi3-py311 rather
# than a lower floor because Py_buffer entered the stable ABI in 3.11, which is what lets
# an array be read without a numpy dependency.
pyo3 = { version = "0.29.0", features = ["abi3-py311"] }
