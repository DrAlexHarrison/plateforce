[package]
name = "plateforce-python"
description = "Python bindings, built as an abi3 wheel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "plateforce"
crate-type = ["cdylib", "rlib"]

[features]
default = ["parquet"]
# The batch surface's `write_parquet` is compiled against this name, so without it the method
# is absent from the wheel and a notebook has no way to reach it.
parquet = ["plateforce-batch/parquet"]

[dependencies]
plateforce-analysis = { workspace = true }
plateforce-batch = { workspace = true, default-features = false }
plateforce-core = { workspace = true }
serde_json = { workspace = true }
plateforce-registry = { workspace = true }

# 0.29 is the first release carrying the fix for GHSA-36hh-v3qg-5jq4, an out-of-bounds
# read in the PyList and PyTuple iterators, and it requires rustc 1.83. abi3-py311 rather
# than a lower floor because Py_buffer entered the stable ABI in 3.11, which is what lets
# an array be read without a numpy dependency.
pyo3 = { version = "0.29.0", features = ["abi3-py311"] }

# The build script assembles the registry with the registry crate's own walk, so a set of
# files the directory loader refuses fails this build rather than reaching a wheel.
[build-dependencies]
plateforce-registry = { workspace = true }
