[package]
name = "plateforce-cli"
description = "Command line interface to plateforce."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "plateforce"
path = "src/main.rs"

[dependencies]
plateforce-analysis = { workspace = true }
plateforce-batch = { workspace = true, features = ["parquet"] }
plateforce-core = { workspace = true }
plateforce-registry = { workspace = true }
plateforce-serve = { workspace = true }
clap = { version = "4.6", features = ["derive"] }
anstream = "1"
anstyle-query = "1.1"
terminal_size = "0.4"
serde_json = { workspace = true }

# The build script assembles the registry with the registry crate's own walk, so a set of
# files the directory loader refuses fails this build rather than reaching a machine that
# has no other registry to read.
[build-dependencies]
plateforce-registry = { workspace = true }
