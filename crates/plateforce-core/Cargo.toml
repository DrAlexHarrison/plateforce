[package]
name = "plateforce-core"
description = "Force-plate kinetics. The math has one home and this is it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# For `content_digest`, so a fingerprint and a registry digest are the same function rather
# than two hashes that agree until one of them is changed. Every surface already links it.
plateforce-registry = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
# The saved-plate file. Already in this crate's tree through `plateforce-registry`, which
# reads the registry out of the same format, so naming it here adds no crate to any surface.
toml = { workspace = true }

[dev-dependencies]
# The workspace entry carries `float_roundtrip`. Naming it here rather than taking the bare
# version means the round-trip tests below measure the parser the product ships, instead of
# whichever parser feature unification happened to hand this crate.
serde_json = { workspace = true }
