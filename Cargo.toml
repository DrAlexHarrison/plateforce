[workspace]
resolver = "2"
members = [
    "crates/plateforce-registry",
    "crates/plateforce-core",
    "crates/plateforce-cli",
    "crates/plateforce-conformance",
    "crates/plateforce-wasm",
    "crates/plateforce-python",
]

# The floor is the one the dependency tree actually imposes, not the one we would prefer.
# `toml` reaches `toml_parser`, `indexmap` and `hashbrown`, all of which declare 1.85, so
# a lower number here would be a claim `cargo` disproves on any older toolchain. The one
# Rust package archived from CRAN for a toolchain reason was archived for exactly that gap
# between the declared floor and the real one. `scripts/check-msrv.sh` holds this honest.
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/DrAlexHarrison/plateforce"
authors = ["Alex Harrison"]

[workspace.dependencies]
plateforce-core = { path = "crates/plateforce-core", version = "0.1.0" }
plateforce-registry = { path = "crates/plateforce-registry", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror = "2"

[profile.release]
opt-level = 2
lto = "thin"
