[workspace]
resolver = "2"
members = [
    "crates/plateforce-registry",
    "crates/plateforce-core",
    "crates/plateforce-analysis",
    "crates/plateforce-cli",
    "crates/plateforce-conformance",
    "crates/plateforce-wasm",
    "crates/plateforce-python",
    "crates/plateforce-serve",
    "crates/plateforce-batch",
]

# The desktop shell is a Tauri application and compiling it needs system webkit. A member
# would make `cargo test --workspace` need `libwebkit2gtk-4.1-dev` on every contributor
# machine and inside the browser publication workflow, which installs no system libraries
# at all. It carries its own lockfile and its own toolchain floor.
exclude = ["src-tauri"]

# The floor the dependency tree imposes: `toml` reaches `toml_parser`, `indexmap` and
# `hashbrown`, which declare 1.85. `scripts/check-msrv.sh` holds this honest.
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/DrAlexHarrison/plateforce"
authors = ["Alex Harrison"]

[workspace.dependencies]
plateforce-analysis = { path = "crates/plateforce-analysis", version = "0.1.0" }
plateforce-batch = { path = "crates/plateforce-batch", version = "0.1.0" }
plateforce-core = { path = "crates/plateforce-core", version = "0.1.0" }
plateforce-registry = { path = "crates/plateforce-registry", version = "0.1.0" }
plateforce-serve = { path = "crates/plateforce-serve", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` declared here rather than per crate, because cargo unifies features across
# the build: set in one crate, whether a double survives being written and read back becomes a
# property of who else happens to be compiling. Measured over 200,000 doubles through a typed
# struct, the default parser loses 59,524 of them by one unit in the last place, and this
# feature loses none. Nothing is wrong physically; what it costs is the numbers on two surfaces
# being the same number, which is the property this product sells.
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.9"
thiserror = "2"

[profile.release]
opt-level = 2
lto = "thin"
