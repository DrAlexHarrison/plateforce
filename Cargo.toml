[workspace]
resolver = "2"
members = [
    "crates/plateforce-registry",
    "crates/plateforce-core",
    "crates/plateforce-analysis",
    "crates/plateforce-cli",
    "crates/plateforce-conformance",
    "crates/plateforce-wasm",
    "crates/plateforce-python",
]

# The floor the dependency tree imposes: `toml` reaches `toml_parser`, `indexmap` and
# `hashbrown`, which declare 1.85. `scripts/check-msrv.sh` holds this honest.
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/DrAlexHarrison/plateforce"
authors = ["Alex Harrison"]

[workspace.dependencies]
plateforce-analysis = { path = "crates/plateforce-analysis", version = "0.1.0" }
plateforce-core = { path = "crates/plateforce-core", version = "0.1.0" }
plateforce-registry = { path = "crates/plateforce-registry", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror = "2"

[profile.release]
opt-level = 2
lto = "thin"
