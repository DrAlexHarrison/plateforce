# Which workstream may edit which registry entry.
#
# Ten of the fifteen characterised method files hold entries belonging to two
# different workstreams, so ownership inside them is per entry by id rather than per
# file. An id named below wins over its file's default; a file with no default and no
# named entry is unowned, and `entry-ownership.sh` fails on it rather than passing,
# because an entry nobody owns is where a crossing hides.
#
# Six entries outside onset, takeoff and baseline carry a construct those three files
# own, and every one of them is assigned by name in a plan. A named assignment wins
# over ownership inherited from a construct.
#
# `registry/protocols/` is listed unowned deliberately: no plan claims it.

[file_default]
"registry/constructs.toml" = "WS-A"
"registry/methods/onset.toml" = "WS-A"
"registry/methods/takeoff.toml" = "WS-A"
"registry/methods/baseline.toml" = "WS-A"
"registry/methods/acquisition.toml" = "WS-E1"
"registry/methods/agreement-reliability.toml" = "WS-E1"
"registry/methods/asymmetry.toml" = "WS-E1"
"registry/methods/force-rfd-impulse.toml" = "WS-E1"
"registry/methods/integration.toml" = "WS-E1"
"registry/methods/jump-height.toml" = "WS-E1"
"registry/methods/loaded-lift-fv.toml" = "WS-E1"
"registry/methods/multivariate.toml" = "WS-E2"
"registry/methods/normalisation.toml" = "WS-E1"
"registry/methods/phase.toml" = "WS-E1"
"registry/methods/power-work.toml" = "WS-E1"
"registry/methods/reactive-strength.toml" = "WS-E1"
"registry/methods/sprint-start.toml" = "WS-E1"
"registry/methods/trial-validity.toml" = "WS-E1"
"registry/methods/waveform.toml" = "WS-E1"
"registry/presets" = "WS-F"

