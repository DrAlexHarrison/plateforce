[package]
name = "plateforce-r"
version = "0.1.2"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/DrAlexHarrison/plateforce"
authors = ["Alex Harrison"]
publish = false

[lib]
crate-type = ["staticlib"]

# The engine crates are members here rather than in the repository's workspace, so the R
# tree resolves on its own and the CRAN build gets exactly the sources that were checked.
# `tools/sync-engine.sh` resolves what their manifests inherit into the copies, so this
# table never has to mirror a dependency list the engine is free to change. It also owns the
# folder each crate lands in, which drops the `plateforce-` these three share with the
# package they sit inside, because a tar member is only required to hold 100 bytes and the
# engine's own paths are long enough to need every one of them.
[workspace]
members = [
    "registry",
    "core",
    "analysis",
]

[dependencies]
plateforce-analysis = { path = "analysis" }
plateforce-core = { path = "core" }
plateforce-registry = { path = "registry" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
extendr-api = "0.9"

# The same optimisation settings the repository builds every other surface with, so a
# number that differs between R and the browser is not the optimiser's doing.
[profile.release]
opt-level = 2
lto = "thin"
