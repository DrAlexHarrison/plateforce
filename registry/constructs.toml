# What is being measured, above the methods that measure it.
#
# The distinction is load-bearing. Standing-frame and takeoff-frame jump height differ
# by about 144 mm for the same method, so filing them as two methods of one construct
# would assert that they are the same quantity.

[[construct]]
id = "movement_onset"
title = "The instant the movement begins"
unit = "seconds"
notes = "Every downstream interval that starts here inherits this choice."

[[construct]]
id = "takeoff"
title = "The instant the last foot leaves the plate"
unit = "seconds"

[[construct]]
id = "time_to_takeoff"
title = "Elapsed time from movement onset to takeoff"
unit = "seconds"
notes = """
Across 10 published rules on 244 trials the within-trial spread is 38.9 percent of the
trial's own value. This is the metric on which open implementations disagree most.
"""

[[construct]]
id = "jump_height.takeoff_frame"
title = "Centre of mass rise measured from the instant of takeoff"
unit = "meters"
frame = "takeoff"
notes = "Not comparable with standing_frame without a declared correction."

[[construct]]
id = "jump_height.standing_frame"
title = "Centre of mass rise measured from quiet standing"
unit = "meters"
frame = "standing"
notes = "Differs from the takeoff frame by 26 to 45 percent, which is a different quantity."

[[construct]]
id = "system_weight"
title = "Weight of athlete plus any external load during the weighing epoch"
unit = "newtons"
notes = "System weight includes the bar. Bodyweight does not. The registry records real conflations."

[[construct]]
id = "calibrated_force"
title = "Vertical ground reaction force in newtons as the instrument reports it"
unit = "newtons"
notes = "The layer every other construct silently assumes is correct."

[[construct]]
id = "conditioned_force_signal"
title = "Vertical ground reaction force after conditioning and before event detection"
unit = "newtons"
notes = "Group A is a substrate rather than a sibling group. Every other construct is computed on this."

[[construct]]
id = "filter_cutoff_frequency"
title = "The cutoff frequency a conditioning filter is set to"
unit = "hertz"

[[construct]]
id = "baseline_offset"
title = "The plate's zero-load output, estimated separately from the athlete's weight"
unit = "newtons"
notes = "Offset and system weight are two separately estimated constants. Most tools estimate one."

[[construct]]
id = "baseline_noise_scale"
title = "The spread of the reference distribution a noise-relative threshold is scaled by"
unit = "newtons"
notes = """
Quiet-stance force and empty-plate noise are different distributions, so a comparison of
8 SD against 5 SD across the two is not a comparison of threshold magnitude.
"""

[[construct]]
id = "trial_validity"
title = "Whether a trial is admitted to analysis"
unit = "boolean"
notes = "Every gate that rejects a trial is invisible data loss unless it reports what it rejected."

[[construct]]
id = "landing"
title = "The instant the first foot returns to the plate"
unit = "seconds"

[[construct]]
id = "flight_time"
title = "Elapsed time from takeoff to landing"
unit = "seconds"
notes = "Both edges are biased in the same direction by a threshold rule, so the errors compound."

[[construct]]
id = "net_impulse"
title = "Integral of vertical ground reaction force less system weight over a declared interval"
unit = "newton_seconds"

[[construct]]
id = "takeoff_velocity"
title = "Centre of mass velocity at the instant of takeoff"
unit = "meters_per_second"
notes = "Takeoff velocity and peak velocity are different instants. Peak generally precedes takeoff."

[[construct]]
id = "jump_height.landing_frame"
title = "Centre of mass rise measured from takeoff to the height of touchdown"
unit = "meters"
frame = "landing"
notes = """
What flight time actually measures whenever takeoff and landing postures differ, which is measured
and not hypothetical: time down exceeds time up by 0.016 s because subjects land partly crouched.
"""

[[construct]]
id = "jump_height.undeclared"
title = "Centre of mass rise with no declared reference frame"
unit = "meters"
notes = """
A real registry value rather than a gap. An undeclared frame must not compare equal to a declared
one, and one entry's frame is not merely undeclared but non-constant, changing trial to trial.
"""

[[construct]]
id = "braking_phase_start"
title = "The instant the braking phase begins"
unit = "seconds"
notes = """
Two published rules name two different instants and one of them, minimum force, occurs while the
athlete is still accelerating downward. The name and the physics disagree.
"""

[[construct]]
id = "propulsion_phase_start"
title = "The instant the propulsion phase begins"
unit = "seconds"

[[construct]]
id = "propulsion_phase_end"
title = "The instant the propulsion phase ends"
unit = "seconds"
notes = "Peak centre of mass velocity and takeoff are different instants, and both appear in the literature."

[[construct]]
id = "lifting_phase_start"
title = "The instant the positive lifting phase begins on a loaded lift"
unit = "seconds"

[[construct]]
id = "lifting_phase_end"
title = "The instant the positive lifting phase ends on a loaded lift"
unit = "seconds"
notes = "Two rules differ by the braking sub-phase, whose duration is load dependent, and by 24 percent on mean force."

[[construct]]
id = "landing_phase_end"
title = "The instant the landing phase ends"
unit = "seconds"

[[construct]]
id = "phase_model"
title = "Which landmarks are promoted to phase boundaries and what the intervals are called"
unit = "enumeration"
notes = """
Nobody disputes where the landmarks are, modulo onset. What is disputed is which are promoted and
what the intervals are named, and one word denotes different intervals in a vendor product and in
the literature that product's users cite.
"""

[[construct]]
id = "analysis_window"
title = "The interval a per-phase or per-epoch quantity is integrated or searched over"
unit = "seconds"

[[construct]]
id = "sticking_region"
title = "The interval of reduced bar velocity during a maximal lift"
unit = "seconds"
