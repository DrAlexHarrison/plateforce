# Group H. Peak force, rate of force development and impulse.
#
# The epoch gradient is the cleanest single demonstration of the registry's thesis and it lives
# inside one metric family in one table. Two commercial packages on the same isometric traces differ
# by 138 percent at the 0 to 50 ms epoch, 38.3 percent at 0 to 100, 20.7 percent at 0 to 150,
# 4.00 percent at 0 to 250, and 0.00 percent on peak force. Nothing changes across those rows except
# how much of the trace is averaged over: the onset error is a fixed time offset, and dividing it by
# a longer epoch shrinks its relative effect monotonically.

[[method]]
id = "force.peak.gross"
construct = "peak_force"
group = "H"
title = "Peak force with the athlete's weight included"
rule = "Peak force is the maximum of the force series with system weight included in the value."
status = "accepted"
confidence = "high"
debate = "genuine"

[[method.citation]]
key = "guppy2024"
role = "uses"
reference = "Guppy et al. 2024, verbatim on body weight being included in force at onset, peak force and all time-dependent characteristics"
doi = "10.1080/14763141.2021.1974532"
obtained = true

[[method.bias]]
magnitude = 0.25
unit = "fraction"
direction = "high"
criterion = "force.peak.net"
criterion_kind = "model"
source = "plateforce_algebra"
# Gross exceeds net by exactly one system weight, roughly 20 to 30 percent of a typical 3,000 to
# 5,000 N isometric peak. It cascades into force at onset, every epoch force, every onset-anchored
# rate, every impulse and every normalisation denominator. It also interacts with normalisation
# non-obviously: net force per kg and gross force per kg differ by g rather than by a constant
# factor, so recording force per kg without recording the convention has not recorded the method.

[[method.disagrees_with]]
id = "force.peak.net"
kind = "genuine"
note = """
Two respected sources from the same author group take opposite sides and neither cites the other on
the point. Gross peak force is onset-independent; net peak force is onset-dependent whenever net
means peak minus force at onset rather than peak minus baseline weight.
"""

[[method.disagrees_with]]
id = "norm.pct_peak_force"
kind = "genuine"
note = "A percentage-of-peak normalisation requires the net convention and is incompatible with this one."

[method.gui]
surfacing = "force_a_decision"
sensitivity = "very high on the absolute number and on any correlation involving peak force"
rationale = """
It must appear in the auto-generated methods paragraph in words, not only in a configuration hash.
Peak force is otherwise the single most portable metric in the field, agreeing within 1 N across
three independent packages against a within-session minimum detectable change of 322 N.
"""

[[method]]
id = "force.peak.net"
construct = "peak_force"
group = "H"
title = "Peak force with system weight subtracted"
rule = "Peak force is the maximum of the force series after system weight has been subtracted."
status = "accepted"
confidence = "medium"
debate = "genuine"

[[method.citation]]
key = "comfort2020"
role = "uses"
reference = "Comfort et al. 2020, IJSPP 15(4):478-482, obtained as a 2-of-5-page preview; the stated rationale is complete in what is held"
obtained = false

[[method.bias]]
magnitude = 0.284
unit = "coefficient_of_variation"
direction = "wider"
criterion = "force.peak.gross"
criterion_kind = "model"
source = "merrigan2022"
# Reliability differs sharply on identical trials: absolute force at 50 ms has CV 7.1 percent against
# 28.4 percent net, and at 200 ms 9.5 against 22.2 percent. Subtracting body weight from a large
# well-measured number leaves a small difference carrying the error of both, and quadruples the noise.

[[method.disagrees_with]]
id = "force.peak.gross"
kind = "genuine"
note = """
An explicit statistical argument on principle: because body weight correlates with peak force across
athletes, the gross convention inflates every between-subject correlation involving peak force.
"""

[method.gui]
surfacing = "force_a_decision"
sensitivity = "very high on the absolute number and on any correlation involving peak force"

[[method]]
id = "force.peak.estimator"
construct = "peak_force"
group = "H"
title = "Peak as a single sample or as the maximum of a moving average"
rule = "Peak force is the maximum of the raw series, or the maximum of a centred moving average of stated width."
status = "accepted"
confidence = "high"
debate = "genuine"

[[method.parameter]]
name = "averaging_window_seconds"
unit = "seconds"
published_values = [0.0, 0.1]
default = 0.0
default_source = "universal_practice"
required = true

[[method.citation]]
key = "chronojump_r"
role = "uses"
reference = "Chronojump computes a 0.1 s centred moving average peak and never displays or exports it"
