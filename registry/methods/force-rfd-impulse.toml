[[method.bias]]
magnitude = 10.0
unit = "newtons"
direction = "high"
criterion = "force.peak.estimator"
criterion_kind = "model"
source = "plateforce_inference"
# The single-sample peak is upward biased with sampling rate and with filter cutoff, because the
# sample maximum of a noisy signal grows with the number of independent samples in the peak region.
