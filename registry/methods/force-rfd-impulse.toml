unit = "newtons"
direction = "high"
criterion = "force.peak.estimator"
criterion_kind = "model"
source = "plateforce_inference"
# Always at or above the observed peak, with the magnitude depending on how far the trial ran into
# the plateau, so a short trial gives a large gap. Not quantified.

[[method.disagrees_with]]
id = "force.peak.estimator"
kind = "genuine"
note = "Measured against extrapolated maximum force is a real methodological choice with a real argument on each side."

[method.gui]
surfacing = "force_a_decision"
sensitivity = "very large with respect to the analysis window and to onset"
rationale = """
Two numbers both labelled as peak force on one graph is a defect. Any tool offering both must name
them differently in the interface and in the export.
"""

[[method]]
id = "rfd.epoch_from_onset.overlapping"
construct = "rate_of_force_development"
group = "H"
title = "Rate over overlapping epochs all starting at onset"
rule = """
With onset fixed by a declared method, report the force at a stated elapsed time from onset and the
mean rate over that interval. Under a net convention the two are numerically the same quantity in
different units; under a gross convention they are not, because the onset force does not cancel.
"""
# Prose grants recommended for the scheme. The loader refuses it: aagaard2002, which proposes the scheme,
# was never obtained.
status = "accepted"
confidence = "high"
debate = "genuine"

[[method.parameter]]
name = "epoch_ms"
unit = "milliseconds"
published_values = [30.0, 50.0, 90.0, 100.0, 150.0, 200.0, 250.0]
default = 200.0
default_source = "maffiuletti2016"
required = true
notes = "The recommendation attaches to the scheme rather than to any epoch: quantify at multiple time points rather than at a single instant."

[[method.citation]]
key = "aagaard2002"
role = "proposes"
reference = "Aagaard et al. 2002, J Appl Physiol, originating usage, not obtained"
doi = "10.1152/japplphysiol.00283.2002"
obtained = false

[[method.citation]]
key = "maffiuletti2016"
role = "evaluates"
reference = "Maffiuletti et al. 2016, ingested at full quality"
doi = "10.1007/s00421-016-3346-6"
obtained = true

[[method.citation]]
