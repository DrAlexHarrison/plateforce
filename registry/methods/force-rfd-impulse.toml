surfacing = "default_and_show"
sensitivity = "medium, and lower than a rate at matched epochs"
rationale = """
Shown alongside the rate. The reliability argument means a practitioner is usually better served by
impulse than by a rate and the interface should not bury it. Trapezoidal against rectangle-rule
impulse is not a second entry at the rates universal in this literature; it would become a genuine
fork only below roughly 200 Hz, which nothing here uses.
"""

[[method]]
id = "impulse.to_fraction_of_peak_force"
construct = "epoch_impulse"
group = "H"
title = "Force integrated from onset until a fraction of peak force is reached"
rule = "Integrate force from onset until force first exceeds a stated fraction of peak force."
status = "accepted"
confidence = "high"
debate = "genuine"

[[method.parameter]]
name = "fraction_pct"
unit = "percent_of_peak_force"
published_values = [50.0]
default = 50.0
default_source = "chronojump_r"
required = true

[[method.citation]]
key = "chronojump_r"
role = "uses"
reference = "Chronojump maximumIsometricForce.R:386-397; the loop has no upper bound and runs off the array if the threshold is never met"
obtained = true

[[method.disagrees_with]]
id = "impulse.epoch_from_onset"
kind = "genuine"
note = "The same time-against-force anchoring fork as the rate pair: it trades onset sensitivity for peak-force sensitivity."

[method.gui]
surfacing = "surface_on_demand"
sensitivity = "moderate"

[[method]]
id = "impulse.convention"
construct = "epoch_impulse"
group = "H"
title = "Whether system weight is subtracted before integrating"
rule = "Declare whether system weight is subtracted before integrating."
status = "accepted"
confidence = "high"
debate = "single_position"

[[method.parameter]]
name = "convention"
unit = "enumeration"
required = true
notes = "gross or net. Net is universal for jumps; gross is in wide use for dead-start lifts, where there is no meaningful centre of mass velocity to recover."

[[method.citation]]
key = "suchomel2018"
role = "uses"
reference = "Suchomel et al. 2018, gross epoch impulses for dead-start lifts expressed relative to body mass"
doi = "10.3390/sports6030079"
obtained = true

[[method.bias]]
magnitude = 1.0
unit = "fraction"
direction = "high"
criterion = "epoch_impulse"
criterion_kind = "model"
source = "plateforce_algebra"
# Over a 50 ms epoch from a static start, gross impulse is dominated by system weight times the
# epoch, so a large part of what it measures is how heavy the athlete and bar are rather than what
# the athlete did. The isometric case is structurally cleaner: a load cell in series with the athlete
# never reads body weight, so the question does not arise there at all.

[method.gui]
surfacing = "surface_on_demand"
sensitivity = "total on the reported value"

[[method]]
id = "impulse.net_vertical.as_performance_determinant"
construct = "net_impulse"
group = "H"
title = "Net vertical impulse from onset to takeoff as the determinant of jump performance"
rule = """
Integrate force less system weight from onset to takeoff. Takeoff velocity is that impulse divided
by body mass, and height follows.
"""
status = "recommended"
confidence = "high"
debate = "single_position"

[[method.citation]]
key = "kirby2011"
role = "proposes"
reference = "Kirby, McBride, Haines and Dayne 2011, J Appl Biomech 27:207-214"
doi = "10.1123/jab.27.3.207"
obtained = true

[[method.bias]]
magnitude = 0.505
unit = "icc"
direction = "low"
criterion = "onset.threshold.noise_relative"
criterion_kind = "model"
source = "barefoot2022"
# The value itself is robust: cross-software agreement of 0.59 to 0.89 percent against a
# within-session smallest worthwhile change of 9.0 N.s. But the reliability of that same robust value
# collapses from ICC 0.984 to 0.479 on identical data purely from the onset rule. A method can
# preserve the mean and annihilate the ability to track an individual.

[[method.disagrees_with]]
id = "power.peak.instantaneous"
kind = "genuine"
note = "Net vertical impulse relates to jump height analytically; peak power relates to it statistically."

[method.gui]
surfacing = "default_and_show"
sensitivity = "low to onset, low to filter, high to the weighing epoch"
rationale = """
Surfaced by default adjacent to any power variable displayed. It has a different sensitivity profile
from every power variable, which is why reporting both is informative rather than redundant. An error
in the weighing epoch integrates linearly with time.
"""

[[method]]
id = "rpd.phase_anchored"
construct = "rate_of_power_development"
group = "H"
title = "Rate of power development from a phase start to peak power"
rule = "Rate of power development is computed from the start of a declared phase to the instant of peak power."
status = "accepted"
confidence = "high"
debate = "single_position"

[[method.citation]]
key = "vald_glossary"
role = "uses"
reference = "VALD ForceDecks Technical Glossary V2.0"
obtained = true

[[method.bias]]
magnitude = 0.95
unit = "icc"
direction = "narrower"
criterion = "rfd.phase_endpoint_secant.harry"
criterion_kind = "model"
source = "merrigan2022"
# Rate of power development is materially more reliable than rate of force development on the same
# trials: ICC 0.95 with CV 7.15 percent against ICC 0.57 with CV 76.45 percent, and the source
# recommends it as the replacement. The mechanism is not stated anywhere; the plausible reason is
# that power multiplies a filtered-by-integration velocity with force, so it is smoother than a raw
# first derivative. That mechanism should be established before promoting it.

[[method.disagrees_with]]
id = "rpd.peak_to_peak_anchored.amti"
kind = "genuine"

[method.gui]
surfacing = "surface_on_demand"
