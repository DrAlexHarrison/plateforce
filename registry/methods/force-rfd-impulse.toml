group = "H"
title = "The asymptote of a fitted exponential rise"
rule = """
Peak force is the asymptote coefficient of a mono-exponential rise fitted by nonlinear least
squares. It is the value approached as time goes to infinity and is never attained in the trial.
"""
status = "accepted"
confidence = "medium"
debate = "genuine"

[[method.citation]]
key = "chronojump_r"
