# Group D. Takeoff, flight and landing detection.
#
# The rising edge draws on the same three families as the falling edge, absolute,
# percent-bodyweight and noise-relative, so the families add no entries. What does add entries is
# whether the two edges are tied: JumpMetrics detects landing at 20 N sustained 15 ms while
# detecting takeoff at 10 N sustained 250 ms, so tying them is a convention rather than a fact and
# the fingerprint carries which one ran.
#
# The whole group is low-stakes relative to onset, and that is measured rather than assumed. Six
# published takeoff rules on the same 21 participants and the same code span 1.4 cm of jump height
# and 5 ms of movement time, with jump-height ICC spanning 0.965 to 0.976 and movement-time
# coefficient of variation identical at 6.4 percent across all six. Onset and
# takeoff are both thresholds in newtons and a designer would give them the same treatment. They
# must not have it.

[[method]]
id = "takeoff.threshold.absolute_force"
construct = "takeoff"
group = "D"
title = "First sample past a fixed newton threshold"
rule = """
Takeoff is the first sample below a fixed newton threshold, and landing the first sample above it,
optionally qualified by a persistence span.
"""
status = "accepted"
confidence = "high"
debate = "genuine"

[[method.parameter]]
name = "threshold_n"
unit = "newtons"
published_values = [1.0, 5.0, 10.0, 20.0, 25.0, 30.0, 50.0]
default = 20.0
default_source = "vald_glossary"
required = true
notes = """
Not adaptive to the actual noise floor. Peak residual force during flight was measured at
17 +/- 2.4 N on one portable plate, exceeding 20 N on three jumps, so the 10 N, 5 N and sub-1 N
thresholds were all inside the signal noise. One vendor's documented value drifted from 20 N to
30 N across software versions, which no citation can fix.
"""

[[method.parameter]]
name = "persistence_ms"
unit = "milliseconds"
published_values = [15.0, 30.0, 250.0]
notes = """
A 250 ms persistence imposes a minimum detectable flight time of 250 ms, so a minimum jump height
of about 7.7 cm: shorter jumps and hop tests are undetectable at that default.
"""

[[method.citation]]
key = "vald_glossary"
role = "proposes"
reference = "VALD ForceDecks Technical Glossary V2.0, 20 N"
obtained = true

[[method.citation]]
key = "smith2024"
role = "evaluates"
reference = "Smith, Lamont and Barefoot 2024, Int J Exerc Sci 17(1), six takeoff rules on 21 participants"
doi = "10.70252/qbua4521"
obtained = true

[[method.citation]]
key = "street2001"
role = "evaluates"
reference = "Street et al. 2001, elevated threshold against true zero"
doi = "10.1123/jab.17.1.43"
obtained = false

[[method.bias]]
magnitude = 0.015
unit = "fraction"
direction = "high"
criterion = "takeoff.threshold.peak_residual_force"
criterion_kind = "instrument"
source = "street2001"
# A threshold 6 N and 10 N above true zero, once the 0.7 to 2 N signal noise is accounted for, gave
# 1 percent and 1.5 percent overestimation of jump height.

