"""

[[method]]
id = "takeoff.op.search_floor_at_trial_start"
construct = "takeoff"
group = "D"
title = "Search the whole recording for the flight phase"
rule = """
Consider every sample of the recording when placing takeoff, including the samples before the
athlete was weighed.
"""
# Recorded so the two policies read as two values rather than as one value and a silence. A reader
# comparing two records otherwise finds a floor on one and nothing on the other, which reads as a
# rule that has no floor rather than as a rule that searches from the beginning.
status = "accepted"
confidence = "high"
debate = "genuine"

[[method.parameter]]
name = "search_floor_seconds"
unit = "seconds"
published_values = []
required = false
notes = """
The first sample the search may examine, which for this policy is the start of the recording. It
forbids nothing, and that is the fact it records: a takeoff placed here was found rather than
returned for want of anywhere else to look.
"""

[[method.citation]]
key = "plateforce_shipped_convention"
role = "uses"
reference = "The policy this software has applied to its longest-run, descending-crossing and landing-shape takeoff rules since they were written"
obtained = true

[[method.disagrees_with]]
id = "takeoff.op.search_floor_at_weighing_epoch_end"
kind = "genuine"
note = """
Searching the whole recording admits the stretch before the athlete stepped onto the plate and the
stretch after they stepped off, which is what places takeoff 843 ms late on 155 of 244 trials under
the longest-run selection.
"""

[method.failure]
rate = 0.0081
numerator = 2
denominator = 246
corpus = "harrison2011_cmj"
definition = """
Takeoff placed at or before the end of the window the athlete was weighed in, so the run reported
as the flight phase is one the trace held while the athlete was standing still. A rule flooring at
the weighing window cannot reach it and a rule searching the whole recording can, which is what
makes it this policy's failure rather than a threshold rule's.

Weighing window 1 s anchored at the start of the recording, every other value the rule's own
default. takeoff.threshold.longest_run commits it on 2 of 246; takeoff.threshold.descending_crossing
answers on 244 and commits it on none, and takeoff.threshold.landing_shape answers on 134 and
commits it on none, declining on the other 112 rather than publishing an instant.

Rarer than its sibling and worse per instance: the sibling publishes a late takeoff and this one
publishes a flight phase during quiet stance, which leaves the jump's start after its end.
"""
detectability = "silent"

[method.gui]
surfacing = "default_and_show"
sensitivity = "large on an untrimmed recording, none on a recording trimmed to one jump"
rationale = """
Shown for the same reason as the floor it disagrees with: which of the two ran is the difference
between a takeoff found in the jump and a takeoff found somewhere else in the file.
"""

[[method]]
id = "landing.threshold.tied_to_takeoff"
construct = "landing"
group = "D"
title = "First return above the threshold that placed takeoff"
rule = """
Landing is the first sample at or above the threshold that placed takeoff, with no span required
above it. One threshold decides both edges of the flight phase.
"""
status = "accepted"
confidence = "medium"
debate = "genuine"

[[method.citation]]
key = "plateforce_shipped_convention"
role = "uses"
reference = "The convention this software has applied since flight time was first emitted, recorded here so a number produced under it names it"
obtained = true

[[method.disagrees_with]]
id = "landing.threshold.absolute_force"
kind = "genuine"
note = """
Tying the edges makes a threshold error compound: a higher threshold places takeoff earlier and
landing later, so flight time grows at both ends rather than the two errors cancelling. Stating the
rising edge separately lets them differ, and at least one surveyed tool sets them an order of
magnitude apart in persistence.
"""

[method.gui]
surfacing = "default_and_hide"
sensitivity = """
None against the shipped behaviour, which is this rule. Against a separately stated rising edge it
is the whole of the difference in flight time, and flight-time jump height goes as the square of it.
"""
rationale = """
It is what runs when nobody states otherwise, so it is chosen silently and recorded always. Hidden
is not unrecorded: a flight time is comparable with another only when the rule behind both edges is
named.
"""

[[method]]
id = "landing.threshold.absolute_force"
construct = "landing"
group = "D"
title = "First sustained run above a threshold stated for the rising edge"
rule = """
Landing is the first sample beginning a run at or above a threshold stated for the rising edge and
sustained for a stated span, independently of whatever threshold placed takeoff.
"""
status = "accepted"
confidence = "medium"
debate = "genuine"

[[method.parameter]]
name = "threshold_n"
unit = "newtons"
published_values = [20.0]
default = 20.0
default_source = "jumpmetrics"
required = true
notes = """
Only one value was recovered from a surveyed implementation. The falling edge in the same tool sits
at 10 N, so a single published value here is not evidence that the two edges agree.
"""

[[method.parameter]]
name = "persistence_ms"
unit = "milliseconds"
published_values = [15.0]
default = 15.0
default_source = "jumpmetrics"
required = true
notes = """
The same tool requires 250 ms at the falling edge and 15 ms here, a factor of about seventeen. A
landing is a step change and a takeoff is the absence of one, so the two edges are not equally
exposed to a brief excursion.
"""

[[method.citation]]
key = "jumpmetrics"
role = "uses"
reference = "JumpMetrics landing and takeoff detection, as recorded in this project's tool survey rather than read first-hand"
obtained = false

[[method.disagrees_with]]
id = "landing.threshold.tied_to_takeoff"
kind = "genuine"
note = """
A separately stated rising edge lets a threshold error at one edge stay at that edge. Tying the two
makes flight time longer at both ends under a higher threshold.
"""

[method.gui]
surfacing = "surface_on_demand"
sensitivity = """
Unquantified against the tied rule on this corpus. The direction is known: a rising-edge threshold
above the falling-edge one places landing later and lengthens flight time.
"""
rationale = """
Name the rule that placed the rising edge alongside flight time, with the tied alternative one
interaction away. The two edges of a flight phase are two choices, and a tool that offers only one
of them has decided the other.
"""

[[method]]
id = "takeoff.threshold.landing_shape"
construct = "takeoff"
group = "D"
title = "First low-force run the recording closes with a landing"
rule = """
Takeoff is the start of the first low-force run that the recording leaves through a landing, where a
landing is told from a reweighting into propulsion by the shape of the rise out of the run. Force
leaves a genuine flight phase through a collision, so the rise is immediate, very steep, and reaches
several times bodyweight. Force leaves a false one through the athlete pushing against the plate, so
the rise starts slowly and tops out near their own weight. A run that reaches the end of the
recording is classified neither way: there is no rise to read.
"""
status = "accepted"
confidence = "medium"
debate = "genuine"

[[method.parameter]]
name = "threshold_n"
unit = "newtons"
published_values = [20.0]
default = 20.0
default_source = "plateforce_corpus_fit"
required = true
notes = """
What counts as low force, before any shape is read. The value the shape parameters below were fitted
under. The debate about the number itself is the one takeoff.threshold.absolute_force carries under
this name, where seven published values sit between 1 N and 50 N.
"""

[[method.parameter]]
name = "landing_rise_rate_floor_bodyweights_per_second"
unit = "bodyweights_per_second"
published_values = [20.0]
default = 20.0
default_source = "plateforce_corpus_fit"
required = true
notes = """
Steepness does the separating. Landings on this corpus rise at a median 163 bodyweights per second
with a first percentile of 26; a reweighting into propulsion rises at 12. A floor of 20 sits between
them with a factor of 1.6 in hand and keeps 108 of 109 labelled flights.
"""

[[method.parameter]]
name = "landing_peak_floor_bodyweights"
unit = "bodyweights"
published_values = [0.5]
default = 0.5
default_source = "plateforce_corpus_fit"
required = true
notes = """
Height only rejects what cannot be a collision, and it has to stay low: most recordings here stop at
the plate's floor, so a real landing is often truncated before its peak and the fifth percentile of
flight peaks is 0.96 bodyweights. At 0.9 it sat 7 percent under that percentile, close enough that a
weight estimate moving with the capture start flips a verdict. At 0.5 no capture-start figure moved
and impossible outputs fell from 2.11 percent to 1.69 percent, so the tighter floor had been
rejecting real landings.
"""

[[method.parameter]]
name = "maximum_rise_seconds"
unit = "seconds"
published_values = [0.6]
default = 0.6
default_source = "plateforce_corpus_fit"
notes = """
The peak the verdict reads is found inside this window, so the window has to contain the rise it is
measuring. A landing turns over inside about 100 ms and a reweighting takes longer. Truncated to a
few milliseconds, a real landing's peak is cut off before it clears landing_peak_floor_bodyweights
and the run stops counting as a flight phase.
"""

[[method.parameter]]
name = "slope_span_seconds"
unit = "seconds"
published_values = [0.01]
default = 0.01
default_source = "plateforce_corpus_fit"
notes = "Slope is read over this span rather than between adjacent samples, where the converter step and the plate noise dominate the difference."

[[method.parameter]]
name = "minimum_run_seconds"
unit = "seconds"
published_values = [0.008]
default = 0.008
default_source = "plateforce_corpus_fit"
notes = "Below this a run is a few samples of noise crossing the threshold rather than an event."

[[method.parameter]]
name = "bridged_gap_seconds"
unit = "seconds"
published_values = [0.02]
default = 0.02
default_source = "plateforce_corpus_fit"
notes = """
An unloaded plate reading near zero crosses a near-zero threshold repeatedly, which cuts one flight
phase into a dozen runs and measures the shape of a noise blip. A gap is treated as part of the
flight when it is this brief and the force inside it stays under the ceiling below.
"""

[[method.parameter]]
name = "bridged_gap_ceiling_bodyweights"
unit = "bodyweights"
published_values = [0.1]
default = 0.1
default_source = "plateforce_corpus_fit"
notes = "A landing or a push is neither brief nor small, so neither is bridged."

[[method.citation]]
key = "plateforce_corpus_fit"
role = "proposes"
reference = "Fitted on the 244-trial countermovement-jump corpus against runs whose identity the recording settles on its own. Re-fit before trusting these values on a different plate or a different population."
obtained = true

[[method.disagrees_with]]
id = "takeoff.threshold.absolute_force"
kind = "genuine"
note = """
Taking the earliest low-force stretch is destroyed by an athlete who unloads the plate without
leaving it; taking the longest, which is that entry composed with the selection operator, is
destroyed by an untrimmed recording where the athlete standing off the plate afterwards outlasts the
jump. Each is right in the population the other is wrong in, and picking one is picking which
recordings to be wrong about. This rule reads what happens after each run instead.
"""

[method.gui]
surfacing = "surface_on_demand"
sensitivity = """
Decisive on a recording holding anything other than one trimmed jump, and identical to the shipped
rules on one that holds exactly that. It moves takeoff by the whole distance between a step-off and
the jump when the two disagree.
"""
rationale = """
Name it beside takeoff with the two threshold rules one interaction away, because it answers a
question they do not ask: what the force did after the run ended.

Concavity was the third number and it is reported and deliberately not used to decide. The rise from
the run's end to its next peak, with time and force each on zero to one, averages above one half for
a rise that shoots up and flattens and below it for one that starts slowly. On a constructed case it
separates cleanly, 0.64 against 0.33. On the corpus flight runs and other runs both sit at 0.437 to
three decimals, so it carries no information about which is which and a rule using it rejects most
real landings. Steepness and height separate them; concavity does not.
"""
