[[method]]
id = "takeoff.zero_force_nearest_peak_velocity.chronojump"
construct = "takeoff"
group = "D"
title = "Zero-force sample nearest the peak concentric velocity sample"
rule = """
Among all concentric samples where derived force is negative, choose the one whose index is closest
to the peak concentric velocity sample, breaking ties to the earliest.
"""
status = "accepted"
confidence = "high"
debate = "genuine"

[[method.citation]]
key = "chronojump_r"
role = "uses"
reference = "Chronojump encoder/util.R:408-451, findTakeOff, with two alternatives preserved as comments"
obtained = true

[[method.disagrees_with]]
id = "takeoff.threshold.absolute_force"
kind = "genuine"
note = """
A first-crossing rule has a documented reproducible failure mode on jumps with an arm counter-swing,
where an early zero crossing is read as takeoff and the jump is reported very high. Three takeoff
rules were written down and one chosen, with the rejected one's failure mode documented in source.
"""

[method.gui]
surfacing = "default_and_hide"
sensitivity = "very large on encoder jump height, which is measured from this instant"
rationale = "Fails in the opposite direction if a post-takeoff oscillation produces a zero crossing nearer peak velocity."

[[method]]
id = "flight_window.bounding_rule"
construct = "baseline_noise_scale"
group = "D"
title = "The rule that bounds the window a noise-derived threshold is computed from"
rule = """
Define the flight window from which the noise estimate is taken, typically as a stated offset after
the force falls below an absolute threshold to the same offset before it rises above it.
"""
status = "accepted"
confidence = "high"
debate = "single_position"

[[method.parameter]]
name = "trim_ms"
unit = "milliseconds"
published_values = [30.0]
default = 30.0
default_source = "smith2024"
required = true

[[method.parameter]]
name = "bounding_threshold_n"
unit = "newtons"
published_values = [10.0]
default = 10.0
default_source = "smith2024"
required = true
notes = """
Self-reported circularity: because the bounding threshold is below the plate's measured peak
residual force, it removes higher force values from the noise calculation that could stem from
noise, so the true derived threshold would be higher than the one used.
"""

[[method.citation]]
key = "smith2024"
role = "proposes"
reference = "Smith et al. 2024, who flagged the circularity themselves"
doi = "10.70252/qbua4521"
obtained = true

[[method.bias]]
magnitude = -1.0
unit = "newtons"
direction = "low"
criterion = "takeoff.threshold.flight_noise_k_sd"
criterion_kind = "instrument"
source = "smith2024"
# Biases the derived threshold low, and therefore takeoff late and landing early, shortening flight
# time and under-reporting flight-time jump height. Not quantified; the figure carries direction only.

[method.gui]
surfacing = "default_and_hide"
sensitivity = "small on jump height"
rationale = """
The flight phase is simultaneously the only in-trial known-zero reference for drift correction, the
window noise-derived thresholds are computed from, and the region contaminated by peak residual
force. One window doing three jobs, and any error in bounding it propagates to all three.
"""
