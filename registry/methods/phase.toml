criterion_kind = "model"
source = "plateforce_measurement"
# The two search signals land one sample apart, 2 ms, on one tool's demo trial, and more than 100 ms
# apart on 11 of 243 corpus trials. A corpus test should not assume the gap is always large.

[[method.disagrees_with]]
id = "phase.braking_start.min_force"
