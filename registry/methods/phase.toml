# Group G. Phase model and boundaries.
#
# Landmarks: O movement onset, M minimum force, B peak negative velocity which is identically the
# rising crossing of system weight, Z zero velocity which is identically minimum displacement,
# V the falling crossing of system weight in late propulsion which is identically peak velocity,
# T takeoff, L touchdown.
#
# Every source partitions the same landmarks. What is disputed is which are promoted to boundaries
# and what the resulting intervals are called, and the naming collision is worse than the boundary
# disagreement. On one raw trace two commercial products report mean braking power differing by 288
# percent with a sign flip, and drop-jump braking duration differing by 59 percent with an
# association of R squared 0.003, because the word names different intervals in the two products.

[[method]]
id = "phase.braking_start.zero_net_force"
construct = "braking_phase_start"
group = "G"
title = "Net force crosses zero upward after the minimum"
rule = """
Braking begins at the instant net force crosses zero upward after the force minimum. Peak negative
centre of mass velocity, force returning to system weight, and zero acceleration are the same
instant, since velocity is stationary exactly where net force is zero.
"""
status = "recommended"
confidence = "high"
debate = "single_position"

[[method.parameter]]
name = "search_signal"
unit = "enumeration"
default_key = "velocity_argmin"
default_source = "plateforce_corpus_fit"
notes = """
Definitionally equivalent and numerically consequential. The intuition that the force crossing is
the sturdy one was measured on 243 trials and is wrong: disagreement magnitude correlates with
raw-force re-crossings at r = +0.640 and with velocity flat-band width at r = -0.062. The velocity
minimum is uniformly soft, about 33 ms wide at the 1 percent level, so it produces no cross-trial
error variance. The multi-valued force crossing does.
"""

[[method.parameter.value]]
key = "velocity_argmin"
label = "Peak negative centre of mass velocity"

[[method.parameter.value]]
key = "force_bw_crossing"
label = "Force returning up through system weight"

[[method.citation]]
key = "mcmahon2018"
role = "proposes"
reference = "McMahon, Suchomel, Lake and Comfort 2018, Strength Cond J 40(4):96-106, a terminology-unification paper"
doi = "10.1519/ssc.0000000000000375"
obtained = true

[[method.citation]]
