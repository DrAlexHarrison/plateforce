[method.gui]
surfacing = "refuse"

[[method]]
id = "power.repeated_jump.bosco1983"
construct = "mechanical_power"
group = "I"
title = "Repeated-jump power from total flight time, total duration and jump count"
rule = """
Power per unit mass is derived from total flight time, total test duration and the number of jumps,
with total duration less total flight time taken as total contact time.
"""
status = "accepted"
