# The seed names this entry "computed_on_object", the one identifier in the registry
# without a dot. Namespaced here because the loader requires a dotted id; the bare name is the field's.
[[method]]
id = "declaration.computed_on_object"
construct = "mechanical_object"
group = "I"
title = "Declare which mechanical object a loaded-lift quantity describes"
rule = """
Declare whether every force, velocity, power, work and impulse in a loaded lift is computed about the
barbell, the body, or the system, and use the matching weight as the subtrahend and the matching mass
as the divisor.
"""
status = "accepted"
confidence = "high"
debate = "single_position"

[[method.parameter]]
name = "object"
unit = "enumeration"
required = true
notes = """
barbell, body, system. The subtrahend is not a constant of the analysis, it is a function of which
object is being described, and subtracting system weight from a barbell-derived force, or barbell
weight from a plate-derived force, are both errors and both easy to make.
"""

[[method.citation]]
key = "blatnik2014"
role = "evaluates"
reference = "Blatnik et al. 2014, J Sports Sci Med 13(3):511-515, verified against its tables"
obtained = true

[[method.citation]]
key = "lake2012jscr"
role = "proposes"
reference = "Lake et al. 2012, stating the rule the domain turns on"
doi = "10.1519/jsc.0b013e31822e7b48"
obtained = true

[[method.bias]]
magnitude = 0.4
unit = "fraction_of_one_repetition_maximum"
direction = "either"
criterion = "mechanical_object"
criterion_kind = "model"
source = "blatnik2014"
# The headline number of the loaded domain. On one deadlift dataset, eight men, same trials, same
# session: peak power occurs at 50 percent of one-repetition maximum for the bar, 30 percent for the
# body and 70 percent for the system. Not a disagreement about data, a threshold or a filter. It is a
# disagreement about what the number is a number about. Two arithmetic defects were found in that
# source by checking rather than reading: its stated bar-force formula omits gravity while its table
# includes it, so the paper cannot be reimplemented from its own words, and the system computation
# states neither that system weight was subtracted nor which mass was used.

[method.gui]
surfacing = "force_a_decision"
sensitivity = "total: different objects give different numbers, different load-power curves and different training prescriptions from identical raw data"
rationale = """
Make it the first question asked whenever a load is declared. The axis does not exist for an unloaded
jump, where the three coincide, and the control must not be shown there. What is deprecated is not
any one object but using one object's kinematics to claim another object's quantity.
"""

[[method]]
id = "normalise.denominator"
construct = "normalisation_basis"
group = "I"
title = "Declare the mass a loaded-lift quantity is expressed relative to"
rule = "Declare the mass a force, power, work or impulse is expressed relative to."
status = "accepted"
confidence = "high"
debate = "single_position"

[[method.parameter]]
name = "denominator"
unit = "enumeration"
required = true
notes = "body mass, system mass or barbell mass. One entry with three values rather than three methods, because no paper argues on principle that another's denominator is wrong."

[[method.citation]]
key = "suchomel2017"
role = "uses"
reference = "Suchomel and Sole 2017, which sets the phase boundary from system weight and normalises the resulting peak power by body mass"
obtained = true

[[method.citation]]
key = "harbili2012"
role = "uses"
reference = "Harbili 2012 and the weightlifting lineage, normalising to barbell mass"
obtained = true

[method.gui]
surfacing = "surface_on_demand"
sensitivity = "a units question that silently breaks cross-study comparison"
rationale = """
Show a unit label naming the denominator rather than a bare per-kilogram label. Relative power in the
weightlifting literature and in strength and conditioning differ by the athlete-to-bar mass ratio,
which varies across a competition field by a factor of two.
"""

[[method]]
id = "power.flywheel_isoinertial"
construct = "mechanical_power"
group = "I"
title = "Power from the moment of inertia and angular velocity of a spinning disc"
rule = "Power is derived from the moment of inertia and the angular velocity of a spinning disc rather than from a ground reaction force."
status = "accepted"
confidence = "medium"
debate = "single_position"

[[method.citation]]
key = "smajla2022"
role = "evaluates"
reference = "Smajla et al. 2022, Front Physiol 13:828394, comparing force-velocity profiles from jumps against flywheel squats"
obtained = true

[method.gui]
surfacing = "never_a_user_choice"
sensitivity = "not comparable to a plate-derived power"
rationale = """
Registered as a device class rather than as a force-plate variant: there is no ground reaction force
in it at all. Registering the device class as a provenance attribute, separate from the formula
field, is the clean design, and the published cross-modality comparison makes it exactly the kind of
agreement question this registry exists to represent.
"""

[[method]]
id = "power.upper_body_ballistic.end_of_concentric.frost2010"
construct = "propulsion_phase_end"
group = "I"
title = "End-of-concentric detection for ballistic upper-body movements"
rule = "A dedicated phase-boundary detector for ballistic upper-body movements, being the bench-throw analogue of a takeoff threshold."
status = "accepted"
confidence = "low"
debate = "single_position"

[[method.citation]]
key = "frost2010"
role = "proposes"
reference = "Frost, Cronin and Newton 2010, JSCR 24:282-286, not obtained"
doi = "10.1519/jsc.0b013e31819f1e7e"
obtained = false

[method.gui]
surfacing = "surface_on_demand"
rationale = """
The exact rule is not citation-bound and this entry must not be implemented from it. Counted because
its existence establishes that the upper-body ballistic lineage has its own event-detection
literature. In a bench throw the system mass is the bar plus the effective mass of the arms and the
athlete is supported by a bench, so a plate under the bench measures a different system than a plate
under a jumper.
"""
