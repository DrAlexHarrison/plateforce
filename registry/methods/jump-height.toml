construct = "jump_height.takeoff_frame"
group = "F"
title = "Height from the resultant rather than the vertical takeoff velocity"
rule = """
Height is computed from the resultant takeoff velocity of each jump, with centre of mass velocity
from an impulse-momentum integration divided by a separately captured body weight.
"""
status = "legacy"
confidence = "medium"
debate = "vendor_or_legacy"

[[method.citation]]
key = "amti_accupower_manual"
role = "proposes"
reference = "AMTI AccuPower manual, whose wording is internally ambiguous between resultant and vertical"
obtained = true

[[method.bias]]
magnitude = 0.01
unit = "meters"
direction = "high"
criterion = "jumpheight.takeoff.impulse_momentum"
criterion_kind = "instrument"
source = "plateforce_inference"
# If the resultant velocity is used for a vertical jump, height is biased high whenever
# the athlete has any horizontal takeoff velocity, since the resultant is at least the vertical
# component. Arm swing and any lateral push inflate it. Unresolved rather than asserted.

[[method.disagrees_with]]
id = "jumpheight.takeoff.impulse_momentum"
kind = "genuine"
note = "A genuine debate if the resultant reading is correct and a documentation artefact if not."

[method.gui]
surfacing = "surface_on_demand"
sensitivity = "potentially a systematic positive offset on every jump height from this device"
rationale = """
Under a reproduce-legacy option, never a default. This software produced the 2011 reference values
the validation corpus rests on, and it writes exactly 0.00 to jump height, time to takeoff and
reactive strength index simultaneously on 3 of the 244 trials, which are missing values wearing the
costume of a measurement and must be dropped before any comparison.
"""

[method.reach]
boundary = "undetermined"
query = """
whether the plate recorded the two horizontal channels beside the vertical one, which decides whether a resultant takeoff velocity is a reading away or an instrument away
"""

