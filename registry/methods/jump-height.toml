[[method]]
id = "time_to_takeoff.onset_to_takeoff"
construct = "time_to_takeoff"
group = "F"
title = "The interval between the placed onset and the placed takeoff"
rule = """
The elapsed time from the sample the bound onset rule placed to the sample the bound takeoff rule
placed, taken as the difference between the two sample indices multiplied by the sampling interval.
"""
status = "accepted"
confidence = "high"
debate = "single_position"

[method.gui]
surfacing = "default_and_hide"
sensitivity = """
total, and inherited whole from the two landmarks. Across 10 published rules on 244 trials the
within-trial spread is 38.9 percent of the trial's own value, which is the widest disagreement
between open implementations of any quantity in this registry.
"""
rationale = """
The subtraction is not the argument. Both edges are threshold crossings carrying entries of their
own, so the onset rule and the takeoff rule named beside this number are what decide it.
"""

[[method]]
id = "flight_time.takeoff_to_touchdown"
construct = "flight_time"
group = "F"
title = "The interval between the placed takeoff and the return above the same threshold"
rule = """
The elapsed time from the sample the bound takeoff rule placed to the first sample at which force
