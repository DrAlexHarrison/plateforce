# Group F. Jump height.
#
# The method space for a quantity dominated by a phase boundary is combinatorially large and
# actively disputed; the method space for jump height is a closed set that has been stable for
# thirty years.
#
# Applying the rule that a bias may be stated only within one construct re-partitions this group's
# headline numbers: takeoff-velocity-only at -159 mm against a standing-frame criterion is about
# 144 mm of definitional offset plus a 15 mm residual, and the reported rho of 0.517 between the two
# families is construct mismatch rather than a statement about method quality.

[[method]]
id = "jumpheight.frame"
construct = "jump_height.undeclared"
group = "F"
title = "Declare which physical displacement jump height denotes"
rule = """
Declare which physical displacement jump height denotes: apex minus centre of mass height at the
takeoff instant, or apex minus centre of mass height during quiet upright standing. The difference
is the heel rise, being ankle plantarflexion, foot length, and the degree of hip and knee extension
at takeoff.
"""
status = "recommended"
confidence = "high"
debate = "single_position"

[[method.parameter]]
name = "frame"
unit = "enumeration"
required = true
notes = "Both frames are physically valid. What is wrong is not stating which one was computed."

[[method.parameter.value]]
key = "takeoff"
label = "Apex above the centre of mass at the instant of takeoff"

[[method.parameter.value]]
key = "standing"
label = "Apex above the centre of mass in quiet standing"
notes = "Taller than the takeoff frame by the heel rise, which this entry's bias row puts at 0.144 meters."

[[method.citation]]
key = "eythorsdottir2024"
role = "evaluates"
reference = "Eythorsdottir et al. 2024, Sports Med 54(11):2771-2791, organised by equation rather than equipment"
doi = "10.1007/s40279-024-02098-x"
obtained = true

[[method.citation]]
key = "xu2023"
role = "evaluates"
reference = "Xu, Turner, Comfort, Harry, McMahon, Chavda and Bishop 2023, Sports Med 53(5):1055-1072"
doi = "10.1007/s40279-023-01828-x"
obtained = true

[[method.bias]]
magnitude = 0.144
unit = "meters"
direction = "high"
criterion = "jump_height.takeoff_frame"
criterion_kind = "model"
source = "aragon2000"
# Standing frame minus takeoff frame is 26 to 45 percent on average and up to about 15 cm absolute.
# Definitional throughout, never error.

[method.gui]
surfacing = "force_a_decision"
sensitivity = "enormous, larger than any other single choice in this domain"
rationale = """
Once, at analysis setup, with a diagram. This is the one jump-height choice a non-technical user
must not be allowed to default through, because it silently changes the number by more than a
training year's worth of adaptation. Everything below it can be hidden.
"""

[[method]]
id = "jumpheight.takeoff.flight_time"
construct = "jump_height.takeoff_frame"
group = "F"
title = "Height from flight time under the projectile equation"
rule = """
Height is g times flight time squared over eight. The derivation assumes ascent time equals descent
time, that is, that centre of mass height at landing equals centre of mass height at takeoff. The
takeoff and landing detection rules are separate entries and are not part of this one.
"""
status = "accepted"
confidence = "high"
debate = "genuine"

[[method.parameter]]
name = "gravity"
unit = "meters_per_second_squared"
published_values = [9.8, 9.806, 9.80665, 9.81]
default = 9.81
default_source = "linthorne2001"
required = true

[[method.citation]]
