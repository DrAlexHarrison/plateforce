[[method.bias]]
magnitude = 0.005
unit = "meters"
direction = "either"
criterion = "jumpheight.takeoff.impulse_momentum"
criterion_kind = "model"
source = "plateforce_inference"
# In exact arithmetic on a perfect signal it equals the impulse-momentum value. In practice it
# accumulates flight-phase drift on top of the drift already accumulated to takeoff and depends on
# the thresholds at both ends, so it is strictly noisier without inheriting flight time's
# independence from drift. Not quantified.

[[method.disagrees_with]]
id = "jumpheight.takeoff.impulse_momentum"
kind = "naming"
note = "Analytically identical and a strictly worse estimator, so it should carry a stated reason rather than equal billing."

[method.gui]
surfacing = "surface_on_demand"
rationale = """
Note explicitly that it is expected to equal the impulse-momentum value and that a discrepancy
indicates baseline drift. That reframes it from a competing metric into a diagnostic, which is its
real value.
"""

