"""
status = "accepted"
confidence = "high"
debate = "single_position"

[method.gui]
surfacing = "default_and_hide"
sensitivity = """
total, and inherited whole from the threshold that placed both edges. A higher threshold places
takeoff earlier and touchdown later, so the two errors compound rather than cancel and the interval
