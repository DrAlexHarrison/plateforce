# Group K. Reactive strength and ratio metrics.
#
# The ratio problem in its purest form. The denominator is ambiguous, the numerator is ambiguous too,
# and six distinct computable quantities exist of which four are routinely called RSI or RSImod
# without qualification. The dimensional point is load-bearing: jump height over contact time has
# units of velocity and flight time over contact time is dimensionless, and they cannot be converted
# by any constant, because jump height depends on flight time quadratically. Two athletes with
# identical ratios can rank differently on the index.

[[method]]
id = "rsi.jh_over_gct.young1995"
construct = "reactive_strength_index"
group = "K"
title = "Jump height divided by ground contact time"
rule = "Reactive strength is jump height divided by ground contact time on a drop jump."
# Prose grants recommended for the drop jump. Rule 6 bars it: the originating source is a
# book-format serial not retrievable through any route.
status = "accepted"
confidence = "medium"
debate = "genuine"

