surfacing = "force_a_decision"
sensitivity = "very high on everything, and the single most load-bearing scalar in the pipeline"
rationale = """
Force the decision by drawing the selected window on the trace and letting the user move it. The
resulting threshold confidence interval is 72 percent at 0.5 s, 43 percent at 1.0 s and 23 percent
at 1.5 s, so the epoch length is a threshold-precision choice and not a body-weight choice.
"""

[[method]]
id = "bwepoch.adaptive_lowest_variance"
construct = "system_weight"
group = "B"
title = "Search the trace for the lowest-variance window of stated length"
rule = """
Search the trace for the window of stated length with the minimum variance and take it as the
reference epoch, then take system weight as the mean over that window.
"""
# Prose grants recommended on three independent reinventions, none of which rests on a closed paper.
status = "recommended"
confidence = "high"
debate = "genuine"

[[method.parameter]]
name = "window_seconds"
unit = "seconds"
published_values = [0.2, 0.5, 1.0, 2.0]
default = 1.0
default_source = "sams_shiny"
required = true

[[method.parameter]]
name = "variance_floor_pct_bodyweight"
unit = "percent"
published_values = [0.5]
notes = """
In biomex's version the 0.5 percent floor binds in practice, measured at 0.922 N sliding-window SD
against a 4.071 N floor on the tool's own demo trial, so the search is overridden and the effective
rule collapses to a fixed 2.5 percent-below-bodyweight band.
"""

[[method.parameter]]
name = "reject_at_or_below_fraction_of_weight"
unit = "fraction"
default = 0.025
default_source = "plateforce_derivation"
notes = """
Candidate windows whose force sits at or below this fraction of the provisional system weight are
refused, which keeps the unloaded plate out of the search. The plate reads near zero in flight and
is the quietest window in any recording, so without the gate the minimum-variance search selects
the flight phase and system weight collapses. Stated against weight rather than in newtons because
a fixed 20 N gate is 2.5 percent of an 80 kg athlete and 1.7 percent of a 120 kg one, so the same
nominal rule tests the two differently.
"""

[[method.parameter]]
name = "accumulation"
unit = "enumeration"
notes = "The search compares the variance of every candidate window, so how the variance is accumulated decides which window wins whenever two are close."

[[method.parameter.value]]
key = "two_pass"
label = "Take the mean first, then sum the squared departures from it"

[[method.parameter.value]]
key = "cumulative_sum_of_squares"
label = "Carry running sums and take each window's variance by subtraction"
notes = "One pass over the recording rather than one per window, and it loses precision where the squared sum is large against the variance."

[[method.parameter]]
name = "dispersion"
unit = "enumeration"
notes = "The spread of the selected window scales every noise-relative threshold downstream, so the divisor travels with the number it produced."

[[method.parameter.value]]
key = "population"
label = "Divide the sum of squares by the sample count"

[[method.parameter.value]]
key = "sample"
label = "Divide the sum of squares by one less than the sample count"

