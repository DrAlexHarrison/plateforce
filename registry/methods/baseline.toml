[[method]]
id = "bwepoch.bar_support_state"
construct = "system_weight"
group = "B"
title = "Declare what supported the bar during the weighing epoch"
rule = """
Declare what supported the bar during the weighing epoch, and require that the subtrahend used
afterwards describes the same supported system.
"""
# Prose grants recommended and soriano2024 is obtained, so the loader accepts it.
status = "recommended"
confidence = "high"
debate = "genuine"

[[method.parameter]]
name = "bar_support_state"
unit = "enumeration"
required = true
notes = """
athlete_supported, floor, rack_pins, blocks. There is no safe default: athlete_supported for a push
press, a jerk, a hang variant and a loaded countermovement jump; floor for a deadlift, clean or
snatch from the floor; rack_pins for a concentric-only squat.
"""

[[method.parameter]]
