unit = "newtons"
direction = "low"
criterion = "bwepoch.adaptive_lowest_variance"
criterion_kind = "model"
source = "plateforce_inference"
# Minimising the mean over candidate windows selects the trough of the sway signal, so system
# weight is biased low and net force, net impulse, takeoff velocity and jump height all inflate.
# The magnitude scales with sway amplitude, so it is largest in the unsteady, fatigued, injured,
# paediatric and elderly populations where longitudinal change is being tracked. Not quantified
# by the vendor; the figure here is a nominal unit magnitude carrying the direction only.

