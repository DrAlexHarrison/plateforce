# Group B. Bodyweight, system weight and the baseline epoch.
#
# One window does three jobs: it sets the integration divisor, the net-force subtrahend, and the
# spread that scales every noise-relative threshold downstream. The third is the one nobody reports,
# and it is why a 0.5 s epoch carries a 72 percent confidence interval on the threshold itself.

[[method]]
id = "bwepoch.fixed_window"
construct = "system_weight"
group = "B"
title = "Mean of force over a fixed span at a fixed anchor"
rule = """
System weight is the mean of vertical ground reaction force over a fixed span at a fixed anchor in
the recording. The standard deviation of the same span supplies the noise scale for any
noise-relative threshold downstream.
"""
status = "accepted"
confidence = "high"
debate = "genuine"

[[method.parameter]]
name = "duration"
unit = "seconds"
published_values = [0.1, 0.25, 0.4, 0.5, 1.0, 2.0]
default = 1.0
default_source = "owen2014"
required = true
notes = """
Street recommends at least 1 s, Pinto and Callaghan 2 s for the standing-frame methods. No
implementation surveyed puts a variance check on the window, so it fails silently and undetectably
when the athlete is not quiet.
"""

[[method.parameter]]
name = "window_anchor"
unit = "enumeration"
notes = "Rate-dependent sample counts are a fingerprint hazard: one stated sample index spans different amounts of time on two recordings."

[[method.parameter.value]]
key = "trial_start"
label = "The first sample of the recording"

[[method.parameter.value]]
key = "stated_index"
label = "A sample index the reader states"

[[method.parameter.value]]
key = "pre_signal"
label = "The span ending where the jump signal begins"
source = "owen2014"
notes = "Owen places the second immediately before the signal rather than at the start of the file, so the two anchors weigh different samples of the same recording."

[[method.parameter]]
name = "centre"
unit = "enumeration"
notes = "The mean is what every published epoch rule states. The median resists a sample the athlete moved during, at the cost of no longer being the quantity the integration divisor is defined as."

[[method.parameter.value]]
key = "mean"
label = "The arithmetic mean of force over the window"

[[method.parameter.value]]
key = "median"
label = "The middle value of force over the window"

[[method.parameter]]
name = "dispersion"
unit = "enumeration"
notes = "The spread of this window scales every noise-relative threshold downstream, so the divisor travels with the number it produced."

[[method.parameter.value]]
key = "population"
label = "Divide the sum of squares by the sample count"

[[method.parameter.value]]
key = "sample"
label = "Divide the sum of squares by one less than the sample count"

[[method.citation]]
key = "owen2014"
role = "proposes"
reference = "Owen et al. 2014, JSCR 28(6):1552-1558, 1.0 s immediately before the jump signal"
doi = "10.1519/JSC.0000000000000311"
obtained = false

[[method.citation]]
key = "street2001"
role = "evaluates"
reference = "Street et al. 2001, JAB 17:43-54, epoch length against jump-height error"
doi = "10.1123/jab.17.1.43"
obtained = false

[[method.citation]]
key = "linthorne2001"
role = "evaluates"
reference = "Linthorne NP 2001, Am J Phys 69(11):1198-1204"
doi = "10.1119/1.1397460"
obtained = true

[[method.bias]]
magnitude = -0.065
unit = "fraction"
direction = "low"
criterion = "jump_height.takeoff_frame"
criterion_kind = "model"
source = "street2001"
# A 0.25 percent body-weight error produces a 6.5 percent jump-height underestimate, and the
# direction is counterintuitive: body weight overestimated gives jump height underestimated.

[[method.bias]]
magnitude = 0.025
unit = "meters"
direction = "either"
criterion = "jump_height.takeoff_frame"
criterion_kind = "model"
source = "linthorne2001"
# A 10 N body-weight error gives 2 to 3 cm of jump height.

