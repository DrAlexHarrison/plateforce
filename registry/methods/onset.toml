onset-bias estimates is the criterion rather than the method under test.
"""

[method.gui]
surfacing = "surface_on_demand"
sensitivity = "unknown, and it bounds the whole domain's validation literature"
rationale = "The fork is this operation's observation rather than a citation, because nobody has published it."

