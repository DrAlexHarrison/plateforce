notes = """
20 N is retained because a large installed base of published and practitioner data is computed with
it. 40 N and 75 N are deprecated on evidence: Guppy concludes a 40 N absolute rise overestimates
force-generating capacity and its use should be avoided, and Dos'Santos found 75 N produced
unacceptable limits of agreement on all force-time variables. Both deprecations are isometric
mid-thigh pull findings and neither tested a jump.
"""

