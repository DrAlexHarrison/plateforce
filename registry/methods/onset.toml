[[method]]
id = "onset.threshold.noise_relative"
construct = "movement_onset"
group = "C"
title = "Noise-relative threshold, k standard deviations of the reference epoch"
rule = """
Onset is the first instant at which force departs the reference epoch's mean by k standard
deviations of that epoch. The epoch length is not fixed by the method and varies by implementation.
Some implementations use the downward side only and some are bidirectional.
"""
status = "accepted"
confidence = "high"
debate = "genuine"

[[method.parameter]]
name = "k"
unit = "standard_deviations"
published_values = [2.0, 2.5, 3.0, 4.0, 5.0, 8.0]
default = 5.0
default_source = "owen2014"
required = true
notes = """
The justification for 5 is thin and is finally located: the threshold is hypothesised to exceed 99
percent of the variation present in the weighing phase, which is a normal-theory tail argument
rather than an empirical derivation. It disagrees with the parent literature, where Hodges and Bui
1996 tested 1, 2 and 3 SD factorially and found 1 or 3 best. Nobody in the EMG literature proposed 5.
"""

[[method.parameter]]
name = "sd_convention"
unit = "enumeration"
notes = """
population or sample. The same author group uses population SD in one paper and sample SD in
another, which is a real registry distinction rather than a typographic one.
"""

[[method.parameter]]
name = "reference_distribution"
unit = "enumeration"
notes = "quiet_stance_force or empty_plate, per noise_ref.distribution. 8 SD of empty plate is not 5 SD of stance."

