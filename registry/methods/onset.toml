# Group C. Movement onset. Twelve detectors and eight refinement operators.
#
# The group the project's founding result is about. A less disciplined sweep of the same literature
# reports 35 to 40 onset methods by counting every threshold value separately, and per-tool filing
# yields over 200. Twelve plus eight is what survives the per-kind-of-rule grain.
#
# Every bias in this group is stated automated minus manual: positive means the automated rule fires
# later than the manual reference, or reads a higher force at onset.

[[method]]
id = "onset.manual_visual.tillin2010"
construct = "movement_onset"
group = "C"
title = "Last peak or trough before the signal deflects from baseline"
rule = """
An experienced analyst views the unfiltered trace at a fixed magnification and marks onset as the
last peak or trough before the signal deflects away from baseline noise. No filtering, no
threshold, no persistence.
"""
status = "recommended"
confidence = "high"
debate = "genuine"

[[method.citation]]
key = "tillin2010"
role = "proposes"
reference = "Tillin, Jimenez-Reyes, Pain and Folland 2010, MSSE 42(4):781-790"
doi = "10.1249/MSS.0b013e3181be9c7e"
obtained = true

[[method.citation]]
key = "guppy2024"
role = "uses"
reference = "Guppy et al. 2024, Sports Biomechanics 23(10):1663-1680, force-plate operationalisation"
doi = "10.1080/14763141.2021.1974532"
obtained = true

[[method.bias]]
magnitude = 0.006
unit = "seconds"
direction = "either"
criterion = "onset.manual_visual.tillin2010"
criterion_kind = "human_visual"
source = "guppy2024"
# Zero bias by definition; the number here is its noise. Intra-rater ICC 1.00 with a mean
# difference of 6 ms across sessions seven days apart. Folland 2014 reports intra- and
# inter-investigator SD of 0.33 and 0.52 ms on a low-noise dynamometer.

[[method.disagrees_with]]
id = "onset.manual_visual.continuous_decrease.pinto2023"
kind = "genuine"
note = "The reference standard is itself forked, and nobody has compared the two instants."

[method.gui]
surfacing = "surface_on_demand"
sensitivity = "defines the scale: a 0.3 to 6 ms human spread against a 22 to 40 ms algorithmic bias"
rationale = """
A manual adjust affordance with a magnified trace, defaulting off, with its use recorded in the
fingerprint. Manual accuracy is conditional on low baseline noise and minimal filtering, so the
correct framing is that the accuracy ordering of onset methods is a function of the acquisition
hardware's noise floor.
"""

[[method]]
id = "onset.manual_visual.continuous_decrease.pinto2023"
construct = "movement_onset"
group = "C"
title = "First instant of continuous decrease from quiet standing"
rule = """
On a plot of stated physical dimensions showing force across three seconds from the middle of a
two-second weighing phase, with a horizontal line at system weight, onset is the first instant
where the signal continuously decreased from quiet standing toward the minimum force of the descent.
"""
status = "accepted"
confidence = "high"
debate = "genuine"

[[method.citation]]
key = "pinto2023"
role = "proposes"
reference = "Pinto and Callaghan 2023, J Appl Biomech 39(2):118-123, 2 of 6 pages served"
doi = "10.1123/jab.2022-0111"
obtained = false

[[method.disagrees_with]]
id = "onset.manual_visual.tillin2010"
kind = "genuine"
note = """
Different instants on the same trace, both called manual identification, both used as the criterion
