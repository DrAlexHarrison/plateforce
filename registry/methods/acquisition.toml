sensitivity = "large on any integral over a long trial, small on a single countermovement jump"
rationale = """
Scope must be recorded or it will be applied where it does nothing and skipped where it matters.
A single countermovement jump supplies one known-zero observation, so the analogue degenerates to
a one-point re-zero and cannot recover a trend.
"""

[[method]]
id = "drift.linear_ramp_to_impulse"
construct = "baseline_offset"
group = "A"
title = "Linear velocity ramp from onset to the impulse-implied takeoff velocity"
rule = """
Set velocity to zero at onset, integrate to takeoff, compute the expected takeoff velocity as net
