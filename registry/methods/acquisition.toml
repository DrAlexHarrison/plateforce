[[method]]
id = "drift.aerial_phase_spline.alcantara2019"
construct = "baseline_offset"
group = "A"
title = "Spline through mid-aerial known-zero values"
rule = """
Take the force value at the middle of each aerial phase, discarding the first and last few frames
of each because the plate has not fully unloaded there, interpolate a third-order spline through
those values at their frame indices, and subtract that spline from the whole signal. Requires a
prior filtering step.
"""
# Prose grants recommended, scoped to trials containing genuine repeated zero-load intervals.
status = "recommended"
confidence = "high"
debate = "single_position"

